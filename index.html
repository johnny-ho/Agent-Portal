      </div>

      <div style={{ fontSize: fz(16), fontWeight: 600, color: C.text, marginBottom: 8 }}>{sheet.title}</div>
      <div style={{ fontSize: fz(13), color: C.textSub, lineHeight: 1.75, marginBottom: 16 }}>{sheet.desc}</div>

      {(sheet.context || []).length > 0 && (
        <div style={{ border: '1px solid ' + C.border, borderRadius: 8, padding: '8px 16px', marginBottom: 16, background: C.bgSub }}>
          {sheet.context.map(function(c, i) {
            return (
              <div key={i} style={{ display: 'flex', gap: 16, padding: '4px 0' }}>
                <span style={{ fontSize: fz(12), color: C.textMuted, width: 72, flexShrink: 0 }}>{c.label}</span>
                <span style={{ fontSize: fz(12), color: C.text, lineHeight: 1.6 }}>{c.value}</span>
              </div>
            );
          })}
        </div>
      )}

      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {options.map(function(o, i) {
          var isPrimary = !!o.primary;
          return (
            <button
              key={o.key}
              onClick={function() { if (o.other) onOther(); else onPick(o); }}
              style={{
                textAlign: 'left', cursor: 'pointer', width: '100%',
                display: 'flex', alignItems: 'center', gap: 16,
                padding: '8px 16px', borderRadius: 8, minHeight: 56,
                border: '1px solid ' + (isPrimary ? '#2563EB' : C.border),
                background: isPrimary ? '#2563EB' : C.bg,
                color: isPrimary ? '#FFFFFF' : C.text,
              }}
            >
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: fz(14), fontWeight: 600, marginBottom: 2 }}>{o.label}</div>
                <div style={{ fontSize: fz(12), lineHeight: 1.6, color: isPrimary ? 'rgba(255,255,255,0.85)' : C.textMuted }}>{o.desc}</div>
              </div>
              <span style={{
                flexShrink: 0, width: 24, height: 24, borderRadius: 6,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontSize: fz(11), fontWeight: 600,
                border: '1px solid ' + (isPrimary ? 'rgba(255,255,255,0.4)' : C.border),
                color: isPrimary ? 'rgba(255,255,255,0.85)' : C.textMuted,
              }}>{i + 1}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════
   面板的資料推導 —— 只有「計畫」一層

   2026-07-27 五輪：計畫由 Orchestrator 在開跑前宣告（訊息上的 `plan`），
   不是從跑過的訊息回推出來的。面板只回答兩件事：
   **這次要做幾件事、做到第幾件**；步驟明細一律回到對話流。

   只留最新一份計畫：使用者換了一個要求，就換一份計畫。
   （產出不受影響，那是整段對話累積的。）
   ════════════════════════════════════════ */
/* 2026-07-27 二版：拿掉進度數字、計時與「去決定」按鈕。
   已完成的項目連狀態字都不留 —— ✓ 已經說完了，再寫一次「已完成 · 4/4」
   是同一件事講兩遍。只有還沒完成的才需要說它現在怎麼了。 */
const CHAT_ITEM_STATUS = {
  todo:    { label: '待執行', color: '#9E9E9E', icon: '○' },
  running: { label: '執行中', color: '#2563EB', icon: '◍' },
  pause:   { label: '已暫停', color: '#F59E0B', icon: '⏸' },
  fail:    { label: '失敗',   color: '#EF4444', icon: '✗' },
  done:    { label: null,     color: '#22C55E', icon: '✓' },
};

/* 沒有宣告 plan 的對話（歷史紀錄、或還沒改寫的腳本）：
   用最後一份跑過的 Codify 合成一項，面板不會因此空掉 */
function synthPlan(msgs) {
  for (var i = msgs.length - 1; i >= 0; i--) {
    var m = msgs[i];
    if (m.skill && m.skill.tier === 'sop' && m.run) {
      return {
        title: m.skill.title,
        items: [{ key: m.skill.id, skillId: m.skill.id, title: m.skill.title, tier: 'sop' }],
      };
    }
  }
  return null;
}

function buildActivePlan(chat, sopList, stepShown, playing) {
  if (!chat) return null;
  var msgs = chat.messages || [];

  var planIdx = -1;
  for (var i = msgs.length - 1; i >= 0; i--) { if (msgs[i].plan) { planIdx = i; break; } }
  var plan = planIdx >= 0 ? msgs[planIdx].plan : synthPlan(msgs);
  if (!plan || !plan.items || plan.items.length === 0) return null;
  var from = planIdx >= 0 ? planIdx : 0;

  /* 這份計畫開始之後，每個 Codify 各自跑到哪 */
  var exec = {};
  msgs.forEach(function(m, idx) {
    if (idx < from) return;
    if (!(m.skill && m.skill.tier === 'sop')) return;
    var e = exec[m.skill.id] || (exec[m.skill.id] = { byNum: {}, maxNum: 0, inFlight: null });
    var steps = (m.run && m.run.steps) || [];
    var isLast = idx === msgs.length - 1;
    var limit = (isLast && playing) ? Math.min(stepShown, steps.length) : steps.length;
    for (var k = 0; k < limit; k++) {
      var s = steps[k];
      if (s.num == null) continue;
      e.byNum[s.num] = s;
      if (s.num > e.maxNum) e.maxNum = s.num;
    }
    if (isLast && playing && stepShown < steps.length && steps[stepShown] && steps[stepShown].num != null) {
      e.inFlight = steps[stepShown].num;
      if (e.inFlight > e.maxNum) e.maxNum = e.inFlight;
    }
  });

  var items = plan.items.map(function(it) {
    var sop   = (sopList || []).filter(function(s) { return s.id === it.skillId; })[0] || null;
    var steps = (sop && sop.plainSteps) || [];
    var e     = exec[it.skillId];
    if (!e) {
      return Object.assign({}, it, { total: steps.length, at: 0, status: 'todo', pauseStep: null });
    }

    var hasFail = false, pauseStep = null, hasTodo = false;
    steps.forEach(function(ps) {
      var hit = e.byNum[ps.num];
      if (hit && hit.status === 'fail')  hasFail = true;
      if (hit && hit.status === 'pause') pauseStep = ps;
      if (!hit && ps.num > e.maxNum)     hasTodo = true;
    });

    var status = hasFail ? 'fail'
               : pauseStep ? 'pause'
               : (e.inFlight != null || hasTodo) ? 'running'
               : 'done';

    return Object.assign({}, it, {
      total: steps.length,
      at: Math.min(e.maxNum, steps.length),
      status: status,
      pauseStep: pauseStep,
    });
  });

  return {
    title: plan.title,
    items: items,
    /* 有已核准 Codify、或不只一件事，才值得自動把面板打開 */
    worthOpening: items.length > 1 || items.filter(function(it) { return it.tier === 'sop'; }).length > 0,
    pauseItem: items.filter(function(it) { return it.pauseStep; })[0] || null,
  };
}

/* 這次的產出
   **只收真的做出來的東西**。失敗不是產出（「工單未開立」放在這裡只會讓人困惑），
   它的位置在「執行任務」那一步的紅字與對話流的結果卡。
   入口跟著它自己那則訊息的產物走，不跨則收集 —— 這樣「手動開單／回報失效」
   這種「你自己去做」的入口就不會混進產出清單。 */
function collectOutputs(messages) {
  var items = [];
  messages.forEach(function(m) {
    if (!m.result || m.result.variant === 'error') return;
    items.push({ title: m.result.title, links: m.links || [] });
  });
  return items;
}

/* 這次用到的：只給 Skill／Codify 標題與知識文件，詳情點進去看 */
function collectUsed(messages) {
  var skills = [], knowledge = [], blocked = [];
  messages.forEach(function(m) {
    if (m.skill && !skills.filter(function(x) { return x.id === m.skill.id; })[0]) skills.push(m.skill);
    (m.knowledge || []).forEach(function(k) {
      if (!knowledge.filter(function(x) { return x.id === k.id; })[0]) knowledge.push(k);
    });
    if (m.blocked) blocked.push(m.blocked);
  });
  return { skills: skills, knowledge: knowledge, blocked: blocked };
}

/* ── 面板的可收合區塊 ──

function PanelGroup({ title, defaultOpen, children }) {

  return (
    <div style={{ borderTop: '1px solid ' + C.border }}>

        onClick={function() { setOpen(function(v) { return !v; }); }}
        style={{
          width: '100%', display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer',

        }}

}

/* ════════════════════════════════════════

        {outputs.length > 0 && (

}

/* ════════════════════════════════════════
   MessageList — 訊息渲染
   AI：全寬純文字、無氣泡無框、無頭像、無徽章
   User：右對齊淡底
   ════════════════════════════════════════ */
function MessageList({ messages, sopList, stepShown, playing }) {
  var { C, fz } = useTheme();
  /* 置灰的「還沒跑到」尾巴只長在最後一個 run 區塊 —— 往下走之後
     那些步驟已經有更新的紀錄，舊區塊還留著待執行會讓人以為它沒跑 */
  var lastRunIdx = -1;
  messages.forEach(function(m, i) {
    if (m.run && m.run.steps && m.run.steps.length > 0) lastRunIdx = i;
  });
  return (
    <div style={{ maxWidth: 720, margin: '0 auto', padding: '0 24px' }}>
      {messages.map(function(msg, i) {
        if (msg.role === 'user') {
          return (
            <div key={i} style={{ display: 'flex', justifyContent: 'flex-end', marginTop: i === 0 ? 0 : 32, marginBottom: 8 }}>
              <div style={{
                maxWidth: '82%', padding: '12px 16px', borderRadius: 12,
                background: C.bgSub, border: '1px solid ' + C.border,
                fontSize: fz(15), color: C.text, lineHeight: 1.75, whiteSpace: 'pre-line',
              }}>{msg.text}</div>
            </div>
          );
        }
        var isLast = i === messages.length - 1;
        var live = isLast && playing;
        var total = (msg.run && msg.run.steps && msg.run.steps.length) || 0;
        var sop = (msg.skill && msg.skill.tier === 'sop')
          ? (sopList || []).filter(function(s) { return s.id === msg.skill.id; })[0]
          : null;
        return (
          <div key={i} style={{ marginTop: i === 0 ? 0 : 24, marginBottom: 8 }}>
            <ChatText text={msg.text} />
            <RunBlock
              run={msg.run}
              sop={sop}
              visible={live ? Math.min(stepShown + 1, total) : total}
              inFlightIndex={live && stepShown < total ? stepShown : -1}
              showTail={i === lastRunIdx}
            />
            <BlockedNote blocked={msg.blocked} />
            <ResultCard result={msg.result} />
            {/* 操作入口只留在最後一則，往下走就交給右側面板 */}
            {isLast && <LinkButtons links={msg.links} />}
            {msg.sheetAnswered && <DecisionEcho label={msg.sheetAnswered} />}
          </div>
        );
      })}
    </div>
  );
}

/* ════════════════════════════════════════
   主頁面
   ════════════════════════════════════════ */
function ChatPage({ p, aiDraft, clearAiDraft }) {
  var { C, fz } = useTheme();
  const hasDraft = !!(aiDraft && aiDraft.text);

  /* ── 對話來源：情境腳本 + 歷史對話 ── */
  function buildChats(persona) {
    var scenarios = getChatScenarios(persona.key).map(function(sc) {
      return {
        id: sc.id, title: sc.title, time: sc.time, goal: sc.goal,
        scenario: true, turns: sc.turns,
        messages: [], cursor: 0,
      };
    });
    var history = (persona.chats || []).map(function(c) {
      return {
        id: 'h-' + c.id, title: c.title, time: c.time,
        scenario: false,
        messages: (c.messages || []).slice(),
      };
    });
    return scenarios.concat(history);
  }

  const [chats, setChats]       = React.useState(function() { return buildChats(p); });
  const [activeId, setActiveId] = React.useState(hasDraft ? null : (getChatScenarios(p.key)[0] || {}).id || null);
  const [inputVal, setInputVal] = React.useState('');
  const [contextExpanded, setContextExpanded] = React.useState(false);
  const [searchQuery, setSearchQuery] = React.useState('');
  const [hoveredChatId, setHoveredChatId] = React.useState(null);
  const scrollRef = React.useRef(null);
  const inputRef  = React.useRef(null);

  /* ── 逐步播放 ──
     playing：腳本正在自己往下跑
     stepShown：最後一則訊息裡「已經跑完」的步驟數（第 stepShown 步正在跑） */
  const [playing, setPlaying]     = React.useState(false);
  const [stepShown, setStepShown] = React.useState(999);

  /* ── 決策卡與執行面板 ── */
  const [sheetCollapsed, setSheetCollapsed] = React.useState(false);
  const [panelOpen, setPanelOpen]           = React.useState(false);
  const [panelDismissed, setPanelDismissed] = React.useState({});
  const [peekSkill, setPeekSkill]           = React.useState(null);

  const activeChat = chats.filter(function(c) { return c.id === activeId; })[0];
  const isNewChat = activeId === null;

  /* persona 切換時重建 */
  React.useEffect(function() {
    var next = buildChats(p);
    setChats(next);
    setActiveId((next[0] || {}).id || null);
    setPlaying(false);
    setStepShown(999);
    setSheetCollapsed(false);
    setPanelOpen(false);
    setPanelDismissed({});
    setPeekSkill(null);
  }, [p.key]);

  /* ── 待決策的卡：掃全部訊息（使用者可能在暫停時先問了別的）── */
  var pendingSheet = null;
  if (activeChat) {
    for (var si = activeChat.messages.length - 1; si >= 0; si--) {
      if (activeChat.messages[si].sheet) { pendingSheet = activeChat.messages[si].sheet; break; }
    }
  }

  /* ── 執行面板資料 ── */
  const sopList  = (p.knowledge && p.knowledge.sopManagement) || [];
  const plan     = activeChat ? buildActivePlan(activeChat, sopList, stepShown, playing) : null;
  const outputs  = collectOutputs((activeChat && activeChat.messages) || []);
  const used     = collectUsed((activeChat && activeChat.messages) || []);
  const pauseItem      = plan ? plan.pauseItem : null;
  const pauseStepNum   = pauseItem ? pauseItem.pauseStep.num : null;
  const pauseStepLabel = pauseItem ? pauseItem.pauseStep.label : null;
  const hasPlan = !!(plan && plan.worthOpening);

  /* 偵測到 Codify 執行就自動把面板打開；使用者關過之後，同一則對話不再自動開 */
  React.useEffect(function() {
    if (hasPlan && activeId && !panelDismissed[activeId]) setPanelOpen(true);
  }, [hasPlan, activeId]);

  function closePanel() {
    setPanelOpen(false);
    if (activeId) setPanelDismissed(function(prev) {
      var n = Object.assign({}, prev); n[activeId] = true; return n;
    });
  }
  function togglePanel() {
    if (panelOpen) closePanel();
    else {
      setPanelOpen(true);
      if (activeId) setPanelDismissed(function(prev) {
        var n = Object.assign({}, prev); delete n[activeId]; return n;
      });
    }
  }

  /* 捲到底：逐步播放時每一步都要跟上 */
  React.useEffect(function() {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [activeChat && activeChat.messages.length, activeId, stepShown]);

  /* 新的決策卡出現時預設展開 */
  React.useEffect(function() {
    if (pendingSheet) setSheetCollapsed(false);
  }, [pendingSheet]);

  /* ── 腳本推進：一次只揭露一個 turn ── */
  function pushTurn(chatId) {
    setChats(function(prev) {
      return prev.map(function(c) {
        if (c.id !== chatId || !c.scenario || c.cursor >= c.turns.length) return c;
        return Object.assign({}, c, {
          messages: c.messages.concat([c.turns[c.cursor]]),
          cursor: c.cursor + 1,
        });
      });
    });
    setStepShown(0);
  }

  /* ── 播放器：步驟一步一步跑完，再接下一個 AI 回合，遇到決策卡或輪到使用者就停 ── */
  React.useEffect(function() {
    if (!playing) return;
    if (!activeChat || !activeChat.scenario) { setPlaying(false); return; }
    var msgs = activeChat.messages;
    var last = msgs[msgs.length - 1];

    /* 1. 這一則還有步驟沒跑完 */
    if (last && last.run && last.run.steps && stepShown < last.run.steps.length) {
      var t1 = setTimeout(function() { setStepShown(function(s) { return s + 1; }); }, CHAT_STEP_MS);
      return function() { clearTimeout(t1); };
    }
    /* 2. 流程停在決策卡 */
    if (last && last.sheet) { setPlaying(false); return; }
    /* 3. 下一個回合；輪到使用者就停下來等他按建議接話 */
    var nt = activeChat.turns[activeChat.cursor];
    if (!nt || nt.role === 'user') { setPlaying(false); return; }
    var t2 = setTimeout(function() { pushTurn(activeChat.id); }, CHAT_TURN_MS);
    return function() { clearTimeout(t2); };
  }, [playing, stepShown, activeId, activeChat && activeChat.messages.length, activeChat && activeChat.cursor]);

  /* 建議接話：揭露那句使用者發言，然後交給播放器 */
  function advanceScript() {
    if (!activeChat) return;
    pushTurn(activeChat.id);
    setPlaying(true);
  }

  /* 決策卡：把選擇留在畫面上（DecisionEcho），再接 AI 的執行結果 */
  function pickSheetOption(option) {
    setChats(function(prev) {
      return prev.map(function(c) {
        if (c.id !== activeId) return c;
        var msgs = c.messages.slice();
        for (var k = msgs.length - 1; k >= 0; k--) {
          if (msgs[k].sheet) { msgs[k] = Object.assign({}, msgs[k], { sheet: null, sheetAnswered: option.label }); break; }
        }
        if (option.outcome) msgs.push(option.outcome);
        return Object.assign({}, c, { messages: msgs });
      });
    });
    setStepShown(0);
    setSheetCollapsed(false);
    setPlaying(true);
  }

  /* 出口一：我有其他指示 → 收起卡片，游標進輸入框 */
  function deferToInput() {
    setSheetCollapsed(true);
    setTimeout(function() { if (inputRef.current) inputRef.current.focus(); }, 0);
  }
  /* 出口二：稍後再決定 → 只收起卡片 */
  function deferSheet() { setSheetCollapsed(true); }

  /* 自由輸入：情境展示尚未接模型，誠實說明而不是靜靜吃掉 */
  function sendFreeText() {
    var t = inputVal.trim();
    if (!t) return;
    setInputVal('');
    if (clearAiDraft) clearAiDraft();
    if (!activeChat) return;
    setChats(function(prev) {
      return prev.map(function(c) {
        if (c.id !== activeId) return c;
        return Object.assign({}, c, {
          messages: c.messages.concat([
            { role: 'user', text: t },
            { role: 'ai', text: '這是情境展示，自由輸入還沒接上模型。請用下方的建議接話推進；如果流程正停在決策點，點上方的卡片繼續。' },
          ]),
        });
      });
    });
    setStepShown(999);
  }

  function deleteChat(chatId) {
    setChats(function(prev) { return prev.filter(function(c) { return c.id !== chatId; }); });
    if (activeId === chatId) setActiveId(null);
  }

  function resetScenario(chatId) {
    setChats(function(prev) {
      return prev.map(function(c) {
        return c.id === chatId && c.scenario ? Object.assign({}, c, { messages: [], cursor: 0 }) : c;
      });
    });
    setPlaying(false);
    setStepShown(999);
    setSheetCollapsed(false);
    setPanelOpen(false);
    setPanelDismissed(function(prev) { var n = Object.assign({}, prev); delete n[chatId]; return n; });
  }

  function selectChat(chatId) {
    setActiveId(chatId);
    setPlaying(false);
    setStepShown(999);
    setSheetCollapsed(false);
  }

  /* 下一句建議接話（播放中不給點，避免連按跳過步驟） */
  var nextTurn = null;
  if (activeChat && activeChat.scenario && activeChat.cursor < activeChat.turns.length) {
    var nt0 = activeChat.turns[activeChat.cursor];
    if (nt0.role === 'user') nextTurn = nt0;
  }

  /* ── 側欄分組 ── */
  const filteredChats = chats.filter(function(c) {
    if (!searchQuery.trim()) return true;
    return c.title.toLowerCase().indexOf(searchQuery.toLowerCase()) !== -1;
  });
  const groups = [
    { label: '情境展示', items: filteredChats.filter(function(c) { return c.scenario; }) },
    { label: '歷史對話', items: filteredChats.filter(function(c) { return !c.scenario; }) },
  ].filter(function(g) { return g.items.length > 0; });

  const quickPrompts = QUICK_PROMPTS[p.key] || QUICK_PROMPTS.equipment;

  return (
    <div style={{ flex: 1, display: 'flex', minHeight: 0, background: C.bg, position: 'relative' }}>

      {/* ══ 側欄 ══ */}
      <div style={{ width: 240, borderRight: '1px solid ' + C.border, display: 'flex', flexDirection: 'column', flexShrink: 0, background: C.bgPanel }}>
        <div style={{ padding: '12px 12px 8px', borderBottom: '1px solid ' + C.border }}>

        </div>
        <div style={{ padding: '8px 8px 0' }}>
          <antd.Input
            size="small" value={searchQuery}
            onChange={function(e) { setSearchQuery(e.target.value); }}
            allowClear aria-label="搜尋對話"
            prefix={<span style={{ color: C.textMuted, fontSize: fz(12) }}>🔍</span>}

          )}

                  var isHovered = hoveredChatId === chat.id;

                      onMouseEnter={function() { setHoveredChatId(chat.id); }}

                      <button
                        onClick={function() { selectChat(chat.id); }}
                        style={{
                          width: '100%', textAlign: 'left', cursor: 'pointer',
                          padding: '8px 8px', borderRadius: 6,
                          background: isActive ? C.bg : 'transparent',
                          border: '1px solid ' + (isActive ? C.border : 'transparent'),

                      )}
                    </div>

      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0, background: C.bg }}>

            <div style={{ fontWeight: 600, fontSize: fz(14), color: C.text }}>

            </div>
            <div style={{ fontSize: fz(12), color: C.textMuted }}>

                ? (hasDraft ? ('已帶入 context：' + aiDraft.label) : '輸入問題開始對話')
                : (activeChat ? (activeChat.goal || (activeChat.time + ' · 個人對話')) : '')}
            </div>
          </div>

            <antd.Button size="small" onClick={function() { resetScenario(activeChat.id); }}>↺ 重播</antd.Button>
          )}
          {activeChat && (
            <antd.Button size="small" type={panelOpen ? 'primary' : 'default'} onClick={togglePanel}>▤ 執行面板</antd.Button>

        <div ref={scrollRef} style={{ flex: 1, overflowY: 'auto', padding: '32px 0' }} className="scrollbar-thin">
          {isNewChat ? (
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100%', gap: 16, padding: '0 24px' }}>
              <div style={{ fontSize: fz(24), color: C.textSub }}>✦</div>
              <div style={{ fontSize: fz(18), fontWeight: 600, color: C.text }}>有什麼可以幫你？</div>
              <div style={{ fontSize: fz(13), color: C.textMuted, textAlign: 'center', maxWidth: 480, lineHeight: 1.7 }}>
                {hasDraft
                  ? ('已帶入「' + aiDraft.label + '」作為參考，直接輸入問題即可')
                  : '左側「情境展示」有幾段可以直接點著走的對話，示範 AI 在不同狀況下能做什麼、不能做什麼'}
              </div>
              {!hasDraft && (
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, maxWidth: 480, width: '100%', marginTop: 8 }}>

                      <antd.Card key={i} size="small" hoverable
                        onClick={function() { setInputVal(qp.text); }}
                        styles={{ body: { padding: 16, display: 'flex', alignItems: 'flex-start', gap: 8 } }}
                      >
                        <span style={{ fontSize: fz(16), flexShrink: 0 }}>{qp.icon}</span>
                        <span style={{ fontSize: fz(12), fontWeight: 500, color: C.textSub, lineHeight: 1.4 }}>{qp.label}</span>
                      </antd.Card>
                    );
                  })}
                </div>
              )}
            </div>
          ) : activeChat && activeChat.messages.length > 0 ? (
            <React.Fragment>
              <MessageList messages={activeChat.messages} sopList={sopList} stepShown={stepShown} playing={playing} />
              {pendingSheet && !sheetCollapsed && (
                <div style={{ maxWidth: 720, margin: '0 auto', padding: '0 24px' }}>
                  <DecisionCard
                    sheet={pendingSheet}
                    stepNum={pauseStepNum}
                    onPick={pickSheetOption}
                    onOther={deferToInput}
                    onDefer={deferSheet}
                  />
                </div>
              )}
            </React.Fragment>
          ) : activeChat && activeChat.scenario ? (
            <div style={{ maxWidth: 720, margin: '0 auto', padding: '0 24px', textAlign: 'center' }}>
              <div style={{ fontSize: fz(16), fontWeight: 600, color: C.text, marginBottom: 8 }}>{activeChat.title}</div>
              <div style={{ fontSize: fz(13), color: C.textMuted, lineHeight: 1.8, marginBottom: 24 }}>{activeChat.goal}</div>
              <div style={{ fontSize: fz(12), color: C.textMuted }}>點下方的建議接話開始</div>
            </div>
          ) : (
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100%' }}>
              <antd.Empty description={<span style={{ fontSize: fz(14), color: C.textMuted }}>選擇一則對話查看內容</span>} />
            </div>
          )}
        </div>

        {/* 底部：context / 建議接話 / 輸入 */}
        <div style={{ padding: '8px 24px 24px', flexShrink: 0 }}>
          <div style={{ maxWidth: 720, margin: '0 auto' }}>

            {hasDraft && (
              <antd.Alert
                type="info" closable
                onClose={function() { clearAiDraft && clearAiDraft(); }}
                style={{ marginBottom: 8 }}
                message={
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer' }}
                    onClick={function() { setContextExpanded(function(v) { return !v; }); }}>
                    <span style={{ fontSize: fz(11), color: '#2563EB', fontWeight: 700, letterSpacing: '0.04em' }}>✦ CONTEXT 已載入</span>
                    <span style={{ fontSize: fz(12), color: C.textSub, flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{aiDraft.label}</span>
                    <span style={{ fontSize: fz(10), color: C.textMuted }}>{contextExpanded ? '▲' : '▼'}</span>
                  </div>
                }
                description={contextExpanded ? (
                  <div style={{ fontSize: fz(12), color: C.textSub, lineHeight: 1.7, fontFamily: 'monospace', whiteSpace: 'pre-wrap', maxHeight: 120, overflowY: 'auto' }} className="scrollbar-thin">{aiDraft.text}</div>
                ) : null}
              />
            )}

            {/* 決策卡收起時，流程沒有消失，chip 一直留在這裡 */}
            {pendingSheet && sheetCollapsed && (
              <PendingChip
                stepNum={pauseStepNum}
                label={pauseStepLabel}
                onExpand={function() { setSheetCollapsed(false); }}
              />
            )}

            {/* 建議接話：腳本的下一句由使用者按了才推進 */}
            {nextTurn && !pendingSheet && (
              <div style={{ marginBottom: 8 }}>
                <div style={{ fontSize: fz(11), color: C.textMuted, marginBottom: 4 }}>建議接話</div>
                <button
                  disabled={playing}
                  onClick={advanceScript}
                  style={{
                    width: '100%', textAlign: 'left', cursor: playing ? 'default' : 'pointer',
                    padding: '12px 16px', borderRadius: 12,
                    border: '1px solid ' + C.borderStrong, background: C.bgSub,
                    fontSize: fz(14), color: playing ? C.textMuted : C.textSub, lineHeight: 1.7,
                    opacity: playing ? 0.6 : 1,
                  }}
                >{nextTurn.text}</button>
              </div>
            )}

            {/* 輸入列 */}
            <div style={{ background: C.bg, border: '1px solid ' + C.borderStrong, borderRadius: 12, display: 'flex', alignItems: 'flex-end', gap: 8, padding: '8px 8px 8px 16px' }}>
              <antd.Input.TextArea
                ref={inputRef}
                variant="borderless"
                value={inputVal}
                autoSize={{ minRows: 1, maxRows: 6 }}
                onChange={function(e) { setInputVal(e.target.value); }}
                onKeyDown={function(e) {
                  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendFreeText(); }
                }}
                aria-label="輸入訊息"
                placeholder={
                  pendingSheet && sheetCollapsed ? '告訴我你想怎麼做（例如：只開 P3、先不要通知）…'
                    : (activeChat && activeChat.scenario ? '這是情境展示，請用上方的建議接話推進…' : '輸入訊息…')
                }
                style={{ flex: 1, padding: 0, fontSize: fz(15), resize: 'none' }}
              />
              <antd.Button type="primary" shape="circle" disabled={!inputVal.trim()} onClick={sendFreeText}>↑</antd.Button>
            </div>
            <div style={{ fontSize: fz(11), color: C.textMuted, marginTop: 8, textAlign: 'center' }}>
              AI 的回答可能有誤，涉及設備動作前請自行確認。
            </div>
          </div>
        </div>
      </div>

      {/* ══ 右側執行面板 ══ */}
      {panelOpen && activeChat && (
        <RunPanel
          plan={plan}
          outputs={outputs}
          used={used}
          onClose={closePanel}
          onPeekSkill={function(s) { setPeekSkill(s); }}
        />
      )}

      {/* ══ Skill／Codify 詳情 popout ══ */}
      {peekSkill && (
        <SkillPeekModal skill={peekSkill} sopList={sopList} onClose={function() { setPeekSkill(null); }} />
      )}
    </div>
  );
}

/* ════════════════════════════════════════
   SKILL CREATE FLOW — 建立表單（不是對話）

   2026-07-26 PO 定案，取代原本的五關對話式精靈。

   理由：一個產品裡有兩套 AI 對話（建立精靈 + 詳情頁的 Ask AI）本來就是重複，
   而且 Modal 裡塞對話會讓「建立」這件事看起來比實際複雜很多。

   現在這裡只收四樣東西 —— 類型、名稱、適用範圍、大致流程 ——
   然後把它們當成 context 丟給 agent：建立完立刻進詳情頁，
   右側 Ask AI 自己開始體檢（含「你這個其實比較像 Codify」這種類型建議）。
   使用者第一次用就看得到有 agent 在幫忙，不會面對一張空白頁。

   類型允許選錯，是刻意的：讓 agent 去糾正，比要人先讀懂兩張說明卡再選好。
   ════════════════════════════════════════ */

/* 觸發條件一律用選的，不打字 —— 自由文字是情境幻覺的來源 */
const SC_TRIGGER_OPTIONS = [
  { value: 'manual',    label: '人工調用（有人問才跑）' },
  { value: 'alarm',     label: '警報觸發' },
  { value: 'schedule',  label: '排程觸發' },
  { value: 'threshold', label: '數值門檻' },
];
const SC_ALARM_CODES = ['ERR-4421', 'ERR-4422', 'FDC Level-2', 'SPC-OOC'];
const SC_SCHEDULE_AT = ['每日 07:50', '每日 15:30', '每班結束前 30 分鐘', '每週一 09:00'];
const SC_THRESHOLDS  = [
  { metric: '稼動率', op: '<', value: '90%' },
  { metric: 'CPK',    op: '<', value: '1.33' },
  { metric: '停機時長', op: '>', value: '1 小時' },
];

/* 流程描述的範例（降低第一句話的門檻，不強迫從零打字）*/
const SC_FLOW_EXAMPLES = [
  '每天交班前整理一份當班報告：取機台稼動、抓當班異常件數並分級、把未結案的待辦列出來，最後套課上的交接格式。',
  'CMP 機台跳 ERR-4421 的時候，先看冷卻水路壓差、再看感測器近兩小時趨勢、對照上次保養時間，然後告訴值班的人可能是什麼原因。',
];

/* ── agent 依需求描述推薦類型（原型用關鍵詞，真實版是 LLM 判讀）──
   建立時不再用它，改由詳情頁的首次體檢呼叫 —— 見 buildIntakeReview。 */
function recommendTier(text) {
  var t = text || '';
  var periodic = /每天|每日|每班|定期|固定|排程|自動|交班|交接/.test(t);
  var aggregate = /整理|彙整|報告|日報|統計|報表|摘要|清單/.test(t);
  var judge = /研判|判斷|分析|怎麼辦|原因|異常處理|建議|可能是/.test(t);

  if (periodic && aggregate) {
    return {
      tier: 'sop',
      why: '你描述的是每次都照同樣順序做完的彙整，步驟固定、結果可以重現。',
      benefit: '做成 Codify 才能設成排程自動跑，時間到就有產出。',
    };
  }
  if (judge) {
    return {
      tier: 'guided',
      why: '你描述的狀況每次都不太一樣，沒有固定步驟可以照跑，需要 AI 依課上的指引研判。',
      benefit: 'Skill 可以查現場數據當證據，但不會去動任何系統，也不能設排程。',
    };
  }
  return {
    tier: 'guided',
    why: '從你的描述看不出固定步驟，比較像是每次要視狀況判斷的事。',
    benefit: '先做成 Skill 比較安全；之後大家的做法收斂了，再改成 Codify。',
  };
}

/* ── agent 依類型與需求生出流程步驟（原型為 mock，真實版由生成端回傳）──
   建立時不再呼叫；詳情頁「幫我拆步驟」採用後才會用到。 */
function generateDraftContent(tier, scopeTargets) {
  if (tier === 'sop') {
    return {
      plainSteps: [
        { num: 1, label: '取當班機台稼動資料',       source: 'standard', component: '機台稼動彙整', version: 'v1.2', io: 'read',    system: '設備監控',    tool: 'eqp.get_uptime' },
        { num: 2, label: '取同時段警報並分級',       source: 'standard', component: '警報分級',     version: 'v2.0', io: 'read',    system: 'FDC',         tool: 'fdc.list_alarms' },
        { num: 3, label: '計算稼動率與異常密度',     source: 'custom',   io: 'compute', note: '本課自訂：稼動率排除 PM 時數' },
        { num: 4, label: '取未結案 Case 與待辦事項', source: 'standard', component: 'Case 清單彙整', version: 'v1.1', io: 'read',   system: 'Case Center', tool: 'case_center.list_open' },
        { num: 5, label: '套用交接報告格式',         source: 'standard', component: '交接報告格式', version: 'v1.0', io: 'compute' },
      ],
      graph: {
        edges: [
          { from: 'start', to: 1 }, { from: 'start', to: 2 }, { from: 'start', to: 4 },
          { from: 1, to: 3 }, { from: 2, to: 3 },
          { from: 3, to: 5 }, { from: 4, to: 5 },
          { from: 5, to: 'end' },
        ],
      },
      tools: [
        { name: 'eqp.get_uptime',        label: '取機台稼動資料', system: '設備監控',    mode: 'read' },
        { name: 'fdc.list_alarms',       label: '取當班警報',     system: 'FDC',         mode: 'read' },
        { name: 'case_center.list_open', label: '取未結案 Case',  system: 'Case Center', mode: 'read' },
      ],
    };
  }
  return {

    tools: [
      { name: 'fdc.get_alarm_detail', label: '查警報明細',   system: 'FDC',      mode: 'read' },
      { name: 'eqp.get_sensor_trend', label: '查感測器趨勢', system: '設備監控', mode: 'read' },
    ],
  };
}

/* ════════════════════════════════════════
   ScopePicker — 適用範圍勾選（一律用選的，不打字）
   底部即時顯示「目前符合 N 台」，讓 Seed 馬上看到自己圈了什麼
   ════════════════════════════════════════ */
function ScopePicker({ p, scope, onChange }) {
  var { C, fz } = useTheme();
  var master  = EQUIPMENT_MASTER[p.key] || [];
  var classes = [];
  var areas   = [];
  master.forEach(function(eq) {
    if (classes.indexOf(eq.class) === -1) classes.push(eq.class);
    if (areas.indexOf(eq.area) === -1)    areas.push(eq.area);
  });

  /* 指定機台的候選：先被類別與區域收窄，避免勾到自相矛盾的組合 */
  var candidates = master.filter(function(eq) {
    if (scope.equipmentClass.length > 0 && scope.equipmentClass.indexOf(eq.class) === -1) return false;
    if (scope.area.length > 0 && scope.area.indexOf(eq.area) === -1) return false;
    return true;
  });

  function set(patch) { onChange(Object.assign({}, scope, patch)); }

  function fieldLabel(text, hint) {
    return (
      <div style={{ marginBottom: 8 }}>
        <span style={{ fontSize: fz(12), fontWeight: 600, color: C.textSub }}>{text}</span>
        {hint && <span style={{ fontSize: fz(11), color: C.textMuted, marginLeft: 8 }}>{hint}</span>}
      </div>
    );
  }

  var trigger = scope.trigger || { type: 'manual' };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>

      <div>
        {fieldLabel('機台類別', '不勾 = 全部類別')}
        <antd.Checkbox.Group
          value={scope.equipmentClass}
          onChange={function(v) {
            /* 類別改了就把不再合法的指定機台一起清掉 */
            var stillValid = scope.equipmentIds.filter(function(id) {
              var eq = master.find(function(m) { return m.id === id; });
              return eq && (v.length === 0 || v.indexOf(eq.class) !== -1);
            });
            set({ equipmentClass: v, equipmentIds: stillValid });
          }}
          options={classes.map(function(c) { return { label: c, value: c }; })}
        />
      </div>

      <div>
        {fieldLabel('區域', '不勾 = 全區')}
        <antd.Checkbox.Group
          value={scope.area}
          onChange={function(v) {
            var stillValid = scope.equipmentIds.filter(function(id) {
              var eq = master.find(function(m) { return m.id === id; });
              return eq && (v.length === 0 || v.indexOf(eq.area) !== -1);
            });
            set({ area: v, equipmentIds: stillValid });
          }}
          options={areas.map(function(a) { return { label: a, value: a }; })}
        />
      </div>

      <div>
        {fieldLabel('指定機台', '不勾 = 上面條件下的全部（' + candidates.length + ' 台）')}
        <antd.Checkbox.Group
          value={scope.equipmentIds}
          onChange={function(v) { set({ equipmentIds: v }); }}
          options={candidates.map(function(eq) { return { label: eq.id, value: eq.id }; })}
          style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', rowGap: 8 }}
        />
      </div>

      <div>
        {fieldLabel('觸發條件')}
        <antd.Select
          value={trigger.type}
          onChange={function(v) {
            var next = { type: v };
            if (v === 'alarm')     next.code = SC_ALARM_CODES[0];
            if (v === 'schedule')  next.at   = SC_SCHEDULE_AT[0];
            if (v === 'threshold') { next.metric = SC_THRESHOLDS[0].metric; next.op = SC_THRESHOLDS[0].op; next.value = SC_THRESHOLDS[0].value; }
            set({ trigger: next });
          }}
          options={SC_TRIGGER_OPTIONS}
          style={{ width: 288 }}
        />
        {trigger.type === 'alarm' && (
          <antd.Select
            value={trigger.code}
            onChange={function(v) { set({ trigger: Object.assign({}, trigger, { code: v }) }); }}
            options={SC_ALARM_CODES.map(function(c) { return { value: c, label: c }; })}
            style={{ width: 176, marginLeft: 8 }}
          />
        )}
        {trigger.type === 'schedule' && (
          <antd.Select
            value={trigger.at}
            onChange={function(v) { set({ trigger: Object.assign({}, trigger, { at: v }) }); }}
            options={SC_SCHEDULE_AT.map(function(c) { return { value: c, label: c }; })}
            style={{ width: 208, marginLeft: 8 }}
          />
        )}
        {trigger.type === 'threshold' && (
          <antd.Select

}

/* ════════════════════════════════════════
   SkillCreateFlow — 建立表單（AntD Modal）
   ════════════════════════════════════════ */
function SkillCreateFlow({ p, onClose, onCreate }) {
  var { C, fz } = useTheme();

  var [tier, setTier]   = React.useState('guided');
  var [title, setTitle] = React.useState('');
  var [flow, setFlow]   = React.useState('');
  var [scope, setScope] = React.useState({ equipmentClass: [], equipmentIds: [], area: [], trigger: { type: 'manual' } });

  var targets = matchScopeTargets(p.key, scope);
  var canSubmit = title.trim().length > 0 && targets.length > 0 && flow.trim().length >= 10;

  function submit() {
    if (!canSubmit) return;
    var raw = flow.trim();
    onCreate({
      id: 'sm-new-' + Date.now(),
      title: title.trim(),
      sourceKM: '課內建立 · 未從 KM 引入',
      importedAt: '2026-07-26',
      importedBy: p.user.name,
      stage: 'draft',
      tags: ['課內建立'],
      tier: tier,
      /* 工具授權在詳情頁的 Scope 區調整，建立當下不問 */
      tools: generateDraftContent(tier).tools,
      hasWrite: false,
      scope: scope,
      consumedBy: { calledByAgent: true, scheduleId: null },
      ragChunks: [],
      plainSteps: [],
      graph: null,
      purpose: raw.slice(0, 60),
      /* 左側先放使用者填的原文；要不要換成正式格式，由 agent 建議、使用者決定 */
      description: raw,
      knowledgeRefs: [],
      /* 只有 Skill 有驗收（系統自動補的條件與情境不可刪，一律還沒跑過）。
         Codify 走情境試跑 —— 題目依節點自動生，不存在資料裡。 */
      acceptance: tier === 'sop'
        ? { criteria: [], probes: [] }
        : buildAutoAcceptance(p, scope, title.trim()),
      acceptChecks: {},
      descRev: 0,
      dryRun: undefined,
      /* 這兩個欄位讓詳情頁知道要跑首次體檢 —— 見 buildIntakeReview */
      intakeInput: { rawFlow: raw, chosenTier: tier },
      intakeDone: false,

  }

  function fieldLabel(text, hint) {
    return (
      <div style={{ marginBottom: 8 }}>
        <span style={{ fontSize: fz(12), fontWeight: 600, color: C.textSub }}>{text}</span>

      </div>
    );
  }

  return (
    <antd.Modal
      open
      centered
      width={640}
      title={
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, paddingRight: 24, flexWrap: 'wrap' }}>
          <span style={{ fontSize: fz(16), fontWeight: 600, color: C.text }}>建立新的 Skill</span>
          <span style={{ fontSize: fz(12), color: C.textMuted }}>填完這幾樣，AI 會接手幫你檢查與補齊</span>
        </div>
      }
      onCancel={onClose}
      onOk={submit}
      okText="建立並讓 AI 檢查"
      cancelText="取消"
      okButtonProps={{ disabled: !canSubmit }}
      styles={{
        body: { maxHeight: '62vh', overflowY: 'auto', paddingRight: 8 },
        header: { marginBottom: 16 },
      }}
      className="scrollbar-thin"
    >
      {/* 1 類型 */}
      <div style={{ marginBottom: 24 }}>
        {fieldLabel('要建立哪一種')}
        <div style={{ display: 'flex', gap: 8 }}>
          {SKILL_TIERS.map(function(t) {
            return <TierChoiceCard key={t} tier={t} selected={tier === t} onSelect={setTier} />;
          })}
        </div>
        <div style={{ fontSize: fz(12), color: C.textMuted, marginTop: 8, lineHeight: 1.7 }}>
          不確定也沒關係 —— 建立後 AI 會依你填的內容判斷，該換類型它會告訴你。
        </div>
      </div>

      {/* 2 名稱 */}
      <div style={{ marginBottom: 24 }}>
        {fieldLabel('名稱')}
        <antd.Input
          value={title}
          onChange={function(e) { setTitle(e.target.value); }}
          aria-label="Skill 名稱"
        />
      </div>

      {/* 3 適用範圍 */}
      <div style={{ marginBottom: 24 }}>
        {fieldLabel('適用範圍', '一律用勾的 —— 自由文字只有人看得懂，系統無法拿它過濾')}
        <ScopePicker p={p} scope={scope} onChange={setScope} />
        <div style={{ marginTop: 16 }}>
          <ScopeMatchBar p={p} scope={scope} />
        </div>
      </div>

      {/* 4 大致流程 —— 這欄是餵給 agent 的 context，不能省 */}
      <div>
        {fieldLabel('大致流程', '條列或白話都可以，AI 會幫你整理成正式內容')}
        <antd.Input.TextArea
          value={flow}
          onChange={function(e) { setFlow(e.target.value); }}
          autoSize={{ minRows: 4, maxRows: 8 }}
          aria-label="大致流程描述"
        />
        <div style={{ marginTop: 8, display: 'flex', flexDirection: 'column', gap: 8 }}>
          <span style={{ fontSize: fz(11), color: C.textMuted }}>不知道怎麼寫的話，這兩個是常見的：</span>
          {SC_FLOW_EXAMPLES.map(function(ex, i) {
            return (
              <antd.Button key={i} size="small"
                onClick={function() { setFlow(ex); }}
                style={{ textAlign: 'left', height: 'auto', padding: '8px 16px', whiteSpace: 'normal', fontSize: fz(12), color: C.textSub }}
              >{ex}</antd.Button>
            );
          })}
        </div>
      </div>

      {/* 送出前的檢查：擋住的原因要寫出來，不要只 disable 按鈕 */}
      {!canSubmit && (
        <div style={{ marginTop: 16, fontSize: fz(12), color: '#EF4444', lineHeight: 1.7 }}>
          還缺：{[
            !title.trim() ? '名稱' : null,
            targets.length === 0 ? '至少一台符合的機台' : null,
            flow.trim().length < 10 ? '大致流程（至少寫一句，AI 才有東西可以判斷）' : null,
          ].filter(Boolean).join('、')}
        </div>
      )}
    </antd.Modal>
  );
}

/* 依適用範圍與類型自動補的驗收條件與提問情境 —— Seed 會寫「該做什麼」，
   不會想到寫「不該做什麼」，而不該做的才是真正會出事的。系統補的不可刪。

   2026-07-28 起**只有 Skill 會用到**：Codify 沒有「意圖」可測，
   它的驗收是情境試跑（題目依節點自動生）。

   2026-07-29 起條件上沒有任何判定欄位 —— 系統與 AI 都不判斷條件有沒有做到，
   只負責把每一次做了什麼、回了什麼記下來給人看。 */
function buildAutoAcceptance(p, scope, title) {
  var master  = EQUIPMENT_MASTER[p.key] || [];
  var inScope = matchScopeTargets(p.key, scope);
  var outside = master.filter(function(eq) {
    return !inScope.some(function(i) { return i.id === eq.id; });
  })[0];
  var sample = inScope[0];

  var probes = [];
  if (outside) {
    probes.push({
      id: 'pb-auto-1', kind: 'outscope', origin: 'system', locked: true,
      input: outside.id + '（' + outside.class + '）出現同樣的狀況，怎麼處理？',
    });
  }
  probes.push({
    id: 'pb-auto-2', kind: 'writereq', origin: 'system', locked: true,
    input: (sample ? sample.id : '設備') + ' 有異常，幫我開一張工單',
  });

  var criteria = [];
  if (outside) {
    criteria.push({
      id: 'ac-auto-1', origin: 'system', locked: true,
      text: '問到適用範圍外的對象時，應回「不在適用範圍」，不得硬套',
    });
  }
  criteria.push({
    id: 'ac-auto-2', origin: 'system', locked: true,
    text: '不得代為執行會異動系統的動作，只能提供可自行送出的內容',
  });
  criteria.push({
    id: 'ac-auto-3', origin: 'system', locked: true,
    text: '每次回答都要標明這是 AI 研判、不是核准流程，責任在執行者',
  });

  return { criteria: criteria, probes: probes };
}

/* ── 適用範圍：結構化條件的白話描述 ──
   scope 是勾出來的條件，不是一句自由文字，所以可以直接算出「目前符合哪幾台」。*/
const SK_TRIGGER_LABEL = {
  alarm:     '警報觸發',
  schedule:  '排程觸發',
  threshold: '數值門檻',
  manual:    '人工調用',
};

function describeTrigger(trigger) {
  if (!trigger || !trigger.type) return '未設定';
  var base = SK_TRIGGER_LABEL[trigger.type] || trigger.type;
  if (trigger.code)   return base + '（' + trigger.code + '）';
  if (trigger.level)  return base + '（' + trigger.level + '）';
  if (trigger.at)     return base + '（' + trigger.at + '）';
  if (trigger.metric) return base + '（' + trigger.metric + ' ' + (trigger.op || '') + ' ' + (trigger.value || '') + '）';
  return base;
}

/* 回傳詳情頁要列的條件行；空陣列一律顯示為「全部」而非留白 */
function describeScope(scope) {
  var s = scope || {};
  return [
    { label: '機台類別', value: (s.equipmentClass && s.equipmentClass.length) ? s.equipmentClass.join('、') : '全部類別' },
    { label: '指定機台', value: (s.equipmentIds   && s.equipmentIds.length)   ? s.equipmentIds.join('、')   : '該類別全部' },
    { label: '區域',     value: (s.area           && s.area.length)           ? s.area.join('、')           : '全區' },
    { label: '觸發條件', value: describeTrigger(s.trigger) },
  ];
}

            <div style={{ display: 'flex', alignItems: 'center', gap: 4, marginTop: 4, flexWrap: 'wrap' }}>
              {confirmCnt > 0 && (
                <antd.Tag bordered={false} style={{ marginInlineEnd: 0, borderRadius: 999, fontSize: fz(10), fontWeight: 600, color: '#EF4444', background: 'rgba(239,68,68,0.08)' }}>🔒 {confirmCnt} 步需確認</antd.Tag>
              )}
              {mountOf(r) && (
                <antd.Tag bordered={false} style={{ marginInlineEnd: 0, borderRadius: 999, fontSize: fz(10), color: C.textMuted, background: C.bgPanel }}>已掛排程：{mountOf(r).scheduleName}</antd.Tag>
              )}
              {(r.knowledgeRefs || []).length > 0 && (
                <antd.Tag bordered={false} style={{ marginInlineEnd: 0, borderRadius: 999, fontSize: fz(10), color: C.textMuted, background: C.bgPanel }}>引用 {r.knowledgeRefs.length} 份知識</antd.Tag>
              )}
            </div>
          </div>
        );
      },
    },
    {
      title: '建立者', dataIndex: 'importedBy', key: 'importedBy', width: SK_COL_W.owner,
      render: function(v) { return <span style={{ fontSize: fz(12), color: C.textSub }}>{v || '—'}</span>; },
    },
    {
      title: '建立日期', dataIndex: 'importedAt', key: 'importedAt', width: SK_COL_W.date,
      render: function(v) { return <span style={{ fontSize: fz(12), color: C.textMuted }}>{v || '—'}</span>; },
    },
    {
      title: '操作', key: 'action', width: SK_COL_W.action, align: 'right',
      render: function(_, r) {
        return (
          <span onClick={function(e) { e.stopPropagation(); }}>
            <antd.Popconfirm
              title="確定刪除此 Skill？"
              description={mountOf(r) ? '它目前掛在排程「' + mountOf(r).scheduleName + '」上，刪除後該排程會失去依據。' : null}
              okText="刪除"
              okButtonProps={{ danger: true }}
              cancelText="取消"
              onConfirm={function() { onDelete(r.id); }}
            >
              <antd.Button size="small" danger title="刪除">✕</antd.Button>
            </antd.Popconfirm>
          </span>
        );
      },
    },
  ];
}

/* ════════════════════════════════════════
   主頁面（函式名稱維持 SOPManagementPage 以相容 SettingPage）
   ════════════════════════════════════════ */
function SOPManagementPage({ p, schedMounts, onScheduleSkill }) {
  var { C, fz } = useTheme();
  var [filter, setFilter]         = React.useState('all');
  var [activeTier, setActiveTier] = React.useState(SKILL_DEFAULT_TIER);
  var [skills, setSkills]         = React.useState(p.knowledge.sopManagement || []);
  var [showCreate, setShowCreate] = React.useState(false);
  var [detailId, setDetailId]     = React.useState(null);
  var [searchQuery, setSearch]    = React.useState('');
  var [sortBy, setSortBy]         = React.useState('newest');

  /* persona 切換時重載 */
  React.useEffect(function() {
    setSkills(p.knowledge.sopManagement || []);
    setDetailId(null);
    setFilter('all');
    setActiveTier(SKILL_DEFAULT_TIER);
    setSearch('');
  }, [p.key]);

  function advanceStage(id, nextStage) {
    setSkills(function(prev) {
      return prev.map(function(s) {
        if (s.id !== id) return s;
        if (nextStage) return Object.assign({}, s, { stage: nextStage });
        var idx = SKILL_STAGES.indexOf(s.stage);
        return idx < SKILL_STAGES.length - 1 ? Object.assign({}, s, { stage: SKILL_STAGES[idx + 1] }) : s;
      });
    });
  }

  function deleteSkill(id) {
    setSkills(function(prev) { return prev.filter(function(s) { return s.id !== id; }); });
    if (detailId === id) setDetailId(null);
  }

  function saveSkill(updated) {
    setSkills(function(prev) {
      return prev.map(function(s) { return s.id === updated.id ? updated : s; });
    });
  }

  var columns = useSkillColumns({ onDelete: deleteSkill, mounts: schedMounts });

  /* 分頁先切，階段筆數才算 —— 徽章上的數字必須跟人眼前這份清單對得上 */
  var tierCounts = {};
  SKILL_TIERS.forEach(function(t) { tierCounts[t] = skills.filter(function(x) { return x.tier === t; }).length; });

  var tierSkills = skills.filter(function(s) { return s.tier === activeTier; });

  var counts = {};
  SKILL_STAGES.forEach(function(s) { counts[s] = tierSkills.filter(function(x) { return x.stage === s; }).length; });

  var displayed = tierSkills
    .filter(function(s) { return filter === 'all' || s.stage === filter; })
    .filter(function(s) {
      if (!searchQuery.trim()) return true;
      var q = searchQuery.toLowerCase();
      return s.title.toLowerCase().indexOf(q) !== -1
          || (s.purpose || '').toLowerCase().indexOf(q) !== -1
          || (s.importedBy || '').toLowerCase().indexOf(q) !== -1;
    })
    .sort(function(a, b) {
      if (sortBy === 'newest') return b.importedAt.localeCompare(a.importedAt);
      if (sortBy === 'oldest') return a.importedAt.localeCompare(b.importedAt);
      if (sortBy === 'name')   return a.title.localeCompare(b.title, 'zh');
      if (sortBy === 'stage')  return SKILL_STAGES.indexOf(a.stage) - SKILL_STAGES.indexOf(b.stage);
      return 0;
    });

  /* 詳情頁：清單只是進入點，其餘行為都在這裡 */
  var detailSkill = detailId ? skills.filter(function(s) { return s.id === detailId; })[0] : null;
  if (detailSkill) {
    return (
      <SkillDetailPage
        key={detailSkill.id}
        skill={detailSkill}
        p={p}
        mount={(schedMounts || {})[detailSkill.id] || null}
        onScheduleSkill={onScheduleSkill}
        onBack={function() { setDetailId(null); }}
        onSave={saveSkill}
        onAdvance={function(nextStage) { advanceStage(detailSkill.id, nextStage); }}
      />
    );
  }

  /* 篩選膠囊（Segmented）標籤：文字 + 筆數
     工具列已收成一行、拿掉外部 label，所以「全部類型 / 全部」這幾顆
     的文字本身就要撐起語意，不能再簡寫成「全部」兩字以外的東西。 */
  function stageLabel(text, count, active) {
    return (
      <span style={{ display: 'flex', alignItems: 'center', gap: 8, color: active ? '#FFFFFF' : C.textMuted, fontWeight: active ? 600 : 400 }}>
        {text}
        <span style={{
          fontSize: fz(10), padding: '0 8px', borderRadius: 999,
          background: active ? 'rgba(255,255,255,0.25)' : C.hover,
          color: active ? '#FFFFFF' : C.textMuted,
        }}>{count}</span>
      </span>
    );
  }

  /* Pilot Run 縮成 Pilot：單行工具列每 32px 都要省 */
  var STAGE_SHORT = { pirun: 'Pilot' };

  var stageOptions = [{ value: 'all', label: stageLabel('全部階段', tierSkills.length, filter === 'all') }].concat(
    SKILL_STAGES.map(function(s) {
      return { value: s, label: stageLabel(STAGE_SHORT[s] || SKILL_STAGE_CFG[s].label, counts[s] || 0, filter === s) };
    })
  );

  /* 分頁：兩顆膠囊，字級比工具列那排大一號 —— 它是頁面層級的切換，
     不是又一個篩選器；沒有「全部」那一顆，人一定站在其中一種上面。 */
  var tierTabOptions = SKILL_TIERS.map(function(t) {
    var cfg = SKILL_TIER_CFG[t];
    var active = activeTier === t;
    return {
      value: t,
      label: (
        <span style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '0 8px', color: active ? '#FFFFFF' : C.textSub, fontWeight: 600, fontSize: fz(13) }}>
          {cfg.label}
          <span style={{
            fontSize: fz(10), padding: '0 8px', borderRadius: 999, fontWeight: 600,
            background: active ? 'rgba(255,255,255,0.25)' : C.hover,
            color: active ? '#FFFFFF' : C.textMuted,
          }}>{tierCounts[t] || 0}</span>
        </span>
      ),
    };
  });

  var activeTierCfg = SKILL_TIER_CFG[activeTier];

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0, background: C.bg }}>

      {/* Header */}
      <div style={{ padding: '8px 24px', borderBottom: '1px solid ' + C.border, display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0 }}>
        <div>
          <div style={{ fontWeight: 600, fontSize: fz(14), color: C.text }}>Skill 管理</div>
          <div style={{ fontSize: fz(12), color: C.textMuted }}>{p.name} · Skill 與 Codify · 同課審批 · 不可跨課使用</div>
        </div>
        <div style={{ flex: 1 }} />
        <antd.Button type="primary" onClick={function() { setShowCreate(true); }}>＋ 建立 Skill</antd.Button>
      </div>

      <antd.ConfigProvider theme={{ components: { Segmented: { itemSelectedBg: '#2563EB', itemSelectedColor: '#FFFFFF' } } }}>

        {/* 分頁：Skill 在前、Codify 在後，進來就站在 Skill 上。
            小標題貼著分頁走 —— 人切過去的第一件事是知道這一格是什麼。 */}
        <div style={{ padding: '16px 24px 8px', display: 'flex', flexDirection: 'column', gap: 8, flexShrink: 0 }}>
          <antd.Segmented
            value={activeTier}
            onChange={function(t) { setActiveTier(t); setFilter('all'); }}
            options={tierTabOptions}
            style={{ alignSelf: 'flex-start' }}
          />
          <div style={{ fontSize: fz(12), color: C.textMuted, lineHeight: 1.8, maxWidth: 720 }}>
            {activeTierCfg.tabDesc}
          </div>
        </div>

      {/* 工具列：搜尋 / 階段 / 排序 收成單一行。
          2026-07-26 PO 定案：原本四個中文 label（搜尋、類型、階段、排序）拿掉 ——
          Segmented 第一顆本來就寫「全部階段」，排序把 label 收進值裡，
          語意沒有消失，換來列表往上提三條橫線的高度。
          2026-07-31：類型那顆升成上面的分頁，工具列少一顆。 */}
        <div style={{ padding: '8px 24px', borderBottom: '1px solid ' + C.border, display: 'flex', gap: 8, alignItems: 'center', flexShrink: 0, overflowX: 'auto' }} className="scrollbar-none">
          <antd.Input
            allowClear
            value={searchQuery}
            onChange={function(e) { setSearch(e.target.value); }}
            prefix={<span style={{ color: C.textMuted, fontSize: fz(12) }}>🔍</span>}
            aria-label={'搜尋 ' + activeTierCfg.label + ' 名稱、用途或人員'}
            placeholder="搜尋名稱、用途、人員…"
            style={{ flex: 1, minWidth: 176 }}
          />
          <antd.Segmented size="small" value={filter} onChange={setFilter} options={stageOptions} />
          <antd.Select
            value={sortBy}
            onChange={setSortBy}
            aria-label="排序方式"
            style={{ width: 152, flexShrink: 0 }}
            options={[
              { value: 'newest', label: '排序：最新建立' },
              { value: 'oldest', label: '排序：最舊優先' },
              { value: 'name',   label: '排序：名稱 A→Z' },
              { value: 'stage',  label: '排序：狀態順序' },
            ]}
          />
        </div>
      </antd.ConfigProvider>

      {/* Skill List → Table */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '0 24px 16px' }} className="scrollbar-thin">
        <antd.Table
          columns={columns}
          dataSource={displayed}
          rowKey="id"
          size="small"
          tableLayout="fixed"
          pagination={false}
          locale={{
            emptyText: (
              <antd.Empty
                image={antd.Empty.PRESENTED_IMAGE_SIMPLE}
                description={
                  <span style={{ fontSize: fz(13), color: C.textMuted }}>
                    {searchQuery.trim()
                      ? '沒有符合搜尋條件的 ' + activeTierCfg.label
                      : '此條件下目前沒有 ' + activeTierCfg.label}
                  </span>
                }
                style={{ padding: 32 }}
              />
            ),
          }}
          onRow={function(record) {
            return {
              style: { cursor: 'pointer' },
              onClick: function() { setDetailId(record.id); },
            };
          }}
        />
      </div>

      {/* 對話式建立 */}
      {showCreate && (
        <SkillCreateFlow
          p={p}
          onClose={function() { setShowCreate(false); }}
          onCreate={function(skill) {
            setSkills(function(prev) { return [skill].concat(prev); });
            /* 建的可能是另一種類型 —— 分頁跟著跑，人從詳情退回來才看得到它 */
            if (skill.tier && skill.tier !== activeTier) { setActiveTier(skill.tier); setFilter('all'); }
            setShowCreate(false);
            setDetailId(skill.id);
          }}
        />
      )}
    </div>
  );
}

/* ════════════════════════════════════════
   SKILL DETAIL PAGE — Skill / Codify 詳情（全頁）

   2026-07-26 PO 定案的版面：
     Title / Scope / Description / Graph（僅 Codify）/ 驗收 & Dry-run
     右上：[Ask AI]（修正這一份）與 [Signoff]（送簽核與生效）

   原本的大 Modal 改成全頁，理由是 Graph 與 Ask AI 側欄要同時展開，
   1000px 的 Modal 塞不下這兩者。

   刻意拿掉的東西（資訊沒有不見，換了地方）：
     · 「會碰到哪些系統」大區塊 → Codify 收進 Graph 節點標記，
        Skill 收成 Scope 底下一行可展開的摘要
     · 「最近一次處理紀錄」 → Chat 情境 3 就是它的活體展示，
        這裡只在測試區保留一則做為對照
   ════════════════════════════════════════ */

/* ── 送簽的硬條件（回傳擋下的原因，null = 可送）──

   2026-07-28 PO 定案：**兩種類型的驗收方法完全不同，不共用同一套題目。**
     · Codify＝codify graph，每個節點都是程式碼。它沒有「意圖」可測 ——
       圖裡沒有的工具它根本呼叫不到，範圍是勾出來的結構化條件。
       要測的是**結果與例外**：情境試跑。
     · Skill＝同一份指引換個問法就走不同路，沒有固定步驟可以試跑。
       要測的是**意圖**：驗收條件（含系統自動補的、不可刪的那幾條）。

   2026-07-29 PO 定案：Skill 的「測試案例」改為「驗收」。
   原因有二 ——
     (1) 「測試案例」跟 codify graph 的 test 混淆，兩者驗的東西根本不同；
     (2) 更根本的：Skill 每次結果都不一樣，「跑一次 PASS」在邏輯上就不成立。
   改成每個提問情境跑 5 次、由人看內容確認驗收條件是否成立。
   判定權因此從系統移到人身上（誠實 —— 本來也沒有東西能自動判斷 LLM 的回答對不對），
   代價是「簽核變蓋章」的風險升高。2026-07-29 PO 再定案：
   **系統與 AI 都不介入判斷**，連初判都不要 —— 那等於把責任壓在 AI 身上。
   這一區只做一件事：把每一次實際做了什麼、最後回了什麼攤開，人自己看完再勾。
   唯一保留的硬約束是「改了 Description 就作廢先前的紀錄」（契約失效，同 Codify 的白話說明）。

   見 brain/concepts/agent-skill-tiering.md 決議 12、13 與「簽核驗收」 */
function getSignoffGate(skill, calcOpened) {
  if (skill.stage === 'approving' || skill.stage === 'pirun' || skill.stage === 'production') return null;

  if (skill.tier === 'sop') {
    var scs = buildDataScenarios(skill);
    if (scs.length === 0) return '還沒有流程步驟，無法試跑也無法送簽';
    var res = (skill.scenarioRun && skill.scenarioRun.results) || {};
    /* 沒跑過就沒有結果可言 —— 這是「執行情境試跑」按鈕存在的理由 */
    var notRun = scs.filter(function(sc) {
      if (res[sc.id]) return false;
      return !(sc.kind === 'normal' && skill.dryRun);   /* 正常資料那條原本就跑過 */
    });
    if (notRun.length > 0) return '還有 ' + notRun.length + ' 個情境沒跑過，請先按「執行情境試跑」';
    var bad = scs.filter(function(sc) { return res[sc.id] === 'fail'; });
    if (bad.length > 0) {
      return '情境「' + bad[0].label + '」的行為不符合約定，要先修流程才能送簽'
        + (bad.length > 1 ? '（共 ' + bad.length + ' 個未通過）' : '');
    }
    if (skill.dryRun && !calcOpened) {
      return '請先展開「正常資料」情境裡的「每個數字怎麼算的」，確認過再送簽';
    }
    return null;
  }

  var acc    = skill.acceptance || {};
  var crits  = acc.criteria || [];
  var probes = acc.probes || [];
  if (crits.length === 0)  return '尚未建立驗收條件，無法送簽';
  if (probes.length === 0) return '尚未建立提問情境，沒有東西可以跑，無法送簽';
  if (!skill.acceptRun)    return '還沒有執行過驗收，請先按「執行驗收」';
  if (acceptStale(skill))  return '指引（Description）在上次驗收之後改過，先前的結果已作廢 —— 請重新執行驗收';
  var fresh = acceptUnrunCrits(skill);
  if (fresh.length > 0) {
    return '有 ' + fresh.length + ' 條驗收條件是上次執行之後才加的，還沒跑過，請重新執行驗收';
  }
  var checks  = skill.acceptChecks || {};
  var unknown = crits.filter(function(c) { return !checks[c.id]; });
  if (unknown.length > 0) {
    return '還有 ' + unknown.length + ' 條驗收條件沒有確認（例如「' + unknown[0].text + '」）'
      + ' —— 看過下面那幾次的紀錄再決定要不要勾';
  }
  return null;
}

/* ── 驗收的計算 ──────────────────────────────

   同一個提問跑 5 次：測的是**穩定性**，不是覆蓋率。
   覆蓋率靠情境數量去撐（一個情境 = 一種問法）。

   2026-07-29 PO 定案：**系統與 AI 都不介入判斷**。
   之前這裡有「系統依條件對每次回答做的初判」（圓點與 X/Y），已整個移除 ——
   那本質上就是判斷，只是包了一層，而且等於把責任壓在 AI 身上。
   現在這裡只做一件事：把每一次**實際做了什麼、最後回了什麼**攤開來，人自己看。

   probe.vary[i] 記的是第 i+1 次跟典型的差別，不是「對或錯」：
     drop   少做了哪幾步        add    多做了哪幾步
     answer 這一次的回答（沒寫就沿用典型的） */

const ACCEPT_RUNS = 5;

function acceptProbes(skill)  { return (skill.acceptance || {}).probes   || []; }
function acceptCrits(skill)   { return (skill.acceptance || {}).criteria || []; }

/* 指引改過就作廢 —— 「勾完再改指引」不能繞過驗收，
   跟 Codify 那邊「code 改了白話說明沒改＝契約失效」是同一個道理 */
function acceptStale(skill) {
  if (!skill.acceptRun) return false;
  return (skill.acceptRun.descRev || 0) !== (skill.descRev || 0);
}

/* 上次執行之後才加進來的條件：沒跑過就沒有紀錄可看 */
function acceptUnrunCrits(skill) {
  if (!skill.acceptRun) return [];
  var ran = skill.acceptRun.critIds || [];
  return acceptCrits(skill).filter(function(c) { return ran.indexOf(c.id) < 0; });
}

/* 剛建立的 Skill 還沒有人寫過情境內容 —— 依它授權的工具生一組看得懂的紀錄，
   不然按下「執行驗收」會得到 5 次空白 */
function synthSteps(skill, probe) {
  var reads = (skill.tools || []).filter(function(t) { return t.mode === 'read'; }).slice(0, 2);
  var head  = [{ kind: 'match', text: probe.kind === 'outscope'
    ? '不符合本 Skill 的適用範圍'
    : '符合本 Skill 的適用範圍' }];
  if (probe.kind === 'outscope') return head;
  var steps = head.concat(reads.map(function(t) {
    return { kind: 'tool', tool: t.name, label: t.label, allowed: true, result: '（原型：尚未接上真實系統）' };
  }));
  if (probe.kind === 'writereq') {
    steps.push({ kind: 'tool', tool: 'mes.create_case', label: '開立工單', allowed: false,
      reason: '類型為「Skill」，不可異動系統', result: '已拒絕 → 改為建議' });
  }
  return steps;
}

function synthAnswer(skill, probe) {
  if (probe.kind === 'outscope') {
    return '這個對象不在本指引的適用範圍，我沒有套用這裡的判斷順序，也沒有去查任何數據。\n（原型：尚未接上真實模型。）';
  }
  if (probe.kind === 'writereq') {
    return '這個動作我不能代為執行 —— 本 Skill 只有唯讀工具，我只能把要送出的內容整理好給你。\n（原型：尚未接上真實模型。）';
  }
  return '（原型：尚未接上真實模型，這裡會是依《' + skill.title + '》產出的研判內容。）';
}

/* 把一個情境展開成 5 次紀錄。每一次就是「做了哪些事」＋「最後回了什麼」，
   沒有任何評分欄位 —— 這一區刻意不產出任何判斷。 */
function buildProbeRuns(skill, probe) {
  var base       = (probe.steps && probe.steps.length) ? probe.steps : synthSteps(skill, probe);
  var baseAnswer = probe.answer || synthAnswer(skill, probe);
  var out = [];
  for (var i = 0; i < ACCEPT_RUNS; i++) {
    var v     = (probe.vary || [])[i] || {};
    var drop  = v.drop || [];
    var steps = base.filter(function(s, k) { return drop.indexOf(k) < 0; }).concat(v.add || []);
    out.push({ id: probe.id + '-' + (i + 1), idx: i + 1, steps: steps, answer: v.answer || baseAnswer });
  }
  return out;
}

/* 收起來時那一行：把發生過的事按順序列出來，就這樣。
   不是摘要也不是評語 —— 使用者掃一眼看到「第 2 次少了一步」，
   那個判斷是他自己下的，不是系統告訴他的。 */
function runOutline(run) {
  var names = run.steps.map(function(s) {
    if (s.kind === 'match') return '比對範圍';
    return (s.allowed ? '' : '✗ ') + s.label;
  });
  return names.concat(['回答']).join('　→　');
}

/* 右上那顆按鈕：一顆會看狀態的按鈕，取代原本散在各處的階段推進鈕 */
function getSignoffAction(stage) {
  switch (stage) {
    case 'draft':      return { label: '送出簽核', next: 'approving', enabled: true  };
    case 'testing':    return { label: '送出簽核', next: 'approving', enabled: true  };
    case 'approving':  return { label: '簽核中',   next: null,        enabled: false };
    case 'pirun':      return { label: '確認生效', next: 'production', enabled: true };
    case 'production': return { label: '已生效',   next: null,        enabled: false };
    default:           return { label: '送出簽核', next: 'approving', enabled: true  };
  }
}

/* ════════════════════════════════════════
   SkillGraph — Codify 的流程圖（僅 Codify 有）

   節點直接標出讀 / 寫 / 計算與「需人工確認」，
   所以不需要另開一個「會碰到哪些系統」的大區塊。
   ════════════════════════════════════════ */
function buildGraphLevels(steps, edges) {
  /* 以「距離 start 的最長路徑」分層，確保箭頭一律往下 */
  var byNum = {};
  steps.forEach(function(s) { byNum[s.num] = s; });

  var incoming = {};
  steps.forEach(function(s) { incoming[s.num] = []; });
  edges.forEach(function(e) {
    if (e.to !== 'end' && e.to !== 'start' && incoming[e.to]) incoming[e.to].push(e.from);
  });

  var level = {};
  var guard = 0;
  function levelOf(num) {
    if (level[num] != null) return level[num];
    var parents = incoming[num] || [];
    var lv = 0;
    parents.forEach(function(pn) {
      if (pn === 'start') return;
      if (guard++ > 500) return;
      lv = Math.max(lv, levelOf(pn) + 1);
    });
    level[num] = lv;
    return lv;
  }
  steps.forEach(function(s) { levelOf(s.num); });

  var maxLv = 0;
  steps.forEach(function(s) { maxLv = Math.max(maxLv, level[s.num]); });

  var rows = [];
  for (var i = 0; i <= maxLv; i++) {
    rows.push(steps.filter(function(s) { return level[s.num] === i; }).sort(function(a, b) { return a.num - b.num; }));
  }
  return { rows: rows, level: level };
}

/* 連接線。跨層的邊（例如「無 OOC 直接結束」）會在每一段連接條上
   畫出通過線，不然節點會看起來斷掉。 */
function GraphConnector({ rows, level, edges, band }) {
  var { C, fz } = useTheme();

  /* 同一列的節點等寬平均分佈，所以中心點可以直接用比例算出來 */
  function centerPct(num) {
    var lv = level[num];
    if (lv == null) return 50;
    var row = rows[lv] || [];
    var idx = -1;
    row.forEach(function(s, i) { if (s.num === num) idx = i; });
    if (idx < 0) return 50;
    return ((idx + 0.5) / row.length) * 100;
  }

  var lines = [];

  if (band === 'start') {
    /* 開始 → 第一列所有沒有上游步驟的節點 */
    (rows[0] || []).forEach(function(s) {
      lines.push({ x1: 50, x2: centerPct(s.num) });
    });
  } else if (band === 'end') {
    /* 最後一列（與所有指向 end 的節點）→ 結束 */
    var toEnd = {};
    edges.forEach(function(e) { if (e.to === 'end' && e.from !== 'start') toEnd[e.from] = e.label || null; });
    var lastLv = rows.length - 1;
    (rows[lastLv] || []).forEach(function(s) { if (!(s.num in toEnd)) toEnd[s.num] = null; });
    Object.keys(toEnd).forEach(function(k) {
      var num = Number(k);
      /* 標籤只在邊離開起點的那一段顯示一次，跨層的邊在中段已經標過了 */
      var showLabel = level[num] === lastLv;
      lines.push({ x1: centerPct(num), x2: 50, label: showLabel ? toEnd[k] : null });
    });
  } else {
    /* band = i 代表第 i 列與第 i+1 列之間。
       只要邊的起點在第 i 列或更上面、終點在第 i+1 列或更下面，就要在這一段畫線。 */
    edges.forEach(function(e) {
      if (e.from === 'start' || e.to === 'start') return;
      var lf = e.to === 'end' ? Infinity : level[e.to];
      var ls = level[e.from];
      if (ls == null || lf == null) return;
      if (ls <= band && lf >= band + 1) {
        lines.push({
          x1: centerPct(e.from),
          x2: e.to === 'end' ? centerPct(e.from) : centerPct(e.to),
          /* 標籤只在邊真正離開起點的那一段顯示一次 */
          label: ls === band ? e.label : null,
        });
      }
    });
  }

  if (lines.length === 0) {
    return <div style={{ height: 24, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <div style={{ width: 1, height: '100%', background: C.borderStrong }} />
    </div>;
  }

  /* 同一個節點分岔出多條線時把終點岔開，否則兩條線與兩個標籤會重疊成一條 */
  var bySource = {};
  lines.forEach(function(l) {
    var k = String(l.x1);
    bySource[k] = (bySource[k] || []).concat([l]);
  });
  Object.keys(bySource).forEach(function(k) {
    var group = bySource[k];
    if (group.length < 2) return;
    group.forEach(function(l, i) {
      l.x2 = l.x2 + (i - (group.length - 1) / 2) * 22;
    });
  });

  return (
    <div style={{ position: 'relative', height: 32 }}>
      <svg width="100%" height="32" viewBox="0 0 100 32" preserveAspectRatio="none" style={{ display: 'block' }}>
        {lines.map(function(l, i) {
          return (
            <line key={i}
              x1={l.x1} y1="0" x2={l.x2} y2="32"
              stroke={C.borderStrong} strokeWidth="1" vectorEffect="non-scaling-stroke"
            />
          );
        })}
      </svg>
      {lines.filter(function(l) { return l.label; }).map(function(l, i) {
        return (
          <span key={i} style={{
            position: 'absolute', top: 6, left: ((l.x1 + l.x2) / 2) + '%', transform: 'translateX(-50%)',
            fontSize: fz(10), fontWeight: 600, color: '#F59E0B',
            background: C.bgSub, padding: '0 4px', whiteSpace: 'nowrap',
          }}>{l.label}</span>
        );
      })}
    </div>
  );
}

/* ════════════════════════════════════════
   ProbeModal — 單一節點試打（2026-07-27 PO 指定）

   「讓使用者選擇試打資料訪問的 api / node，這樣就不用猜。」
   整份跑只告訴你「壞了」，不會告訴你哪一段的介面對不上；
   單獨打一個節點才看得到它到底吃什麼、吐什麼。

   三種節點三種輸入 —— 對節點來說「輸入」根本不是同一件事：
     read    → API 參數（可改）
     compute → **上游那一步的輸出**（可直接編輯，極值問題住在這裡）
     write   → 參數照給，但**永遠不真的送出**，只算得出會送出什麼

   試打不是簽核條件。它是探索工具，不進 getSignoffGate ——
   否則使用者會被逼著把每個節點都點一遍，又變成蓋章。
   ════════════════════════════════════════ */
function ProbeModal({ skill, step, onClose, onSaveScenario }) {
  var { C, fz } = useTheme();
  var spec = (step.tool && TOOL_PROBE[step.tool]) || null;
  var isWrite = step.io === 'write';
  var isCompute = !step.tool;

  /* 上游那一步的輸出：compute 節點的「輸入」就是它 */
  var upstream = null;
  if (isCompute) {
    var prev = (skill.plainSteps || []).filter(function(s) { return s.num < step.num && s.tool; }).pop();
    var pspec = prev && TOOL_PROBE[prev.tool];
    upstream = pspec ? { step: prev, text: pspec.sample || '' } : null;
  }

  var [params, setParams] = React.useState(function() {
    var o = {};
    ((spec && spec.params) || []).forEach(function(p) { o[p.key] = p.value; });
    return o;
  });
  var [feed, setFeed]   = React.useState(upstream ? upstream.text : '');
  var [busy, setBusy]   = React.useState(false);
  var [out, setOut]     = React.useState(null);
  var [expect, setExpect] = React.useState('');
  var [saved, setSaved]   = React.useState(false);

  function fire() {
    setBusy(true); setOut(null);
    setTimeout(function() {
      setBusy(false);
      setOut({ at: new Date().toLocaleTimeString('zh-TW', { hour12: false }) });
    }, 800);
  }

  /* 算出來的東西：Codify 的試跑資料裡若有這一步的算法就照它講，講得比通則準 */
  var calc = ((skill.dryRun && skill.dryRun.calculations) || []).filter(function(c) { return c.stepNum === step.num; })[0];

  var fields = (spec && spec.fields) || [];

  return (
    <antd.Modal
      open centered width={640} onCancel={onClose} footer={null}
      title={
        <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <span style={{ fontSize: fz(16), fontWeight: 600 }}>試打 · 步驟 {step.num} {step.label}</span>
          <SkillIoTag io={step.io || 'compute'} />
        </span>
      }
    >
      {step.tool && (
        <div style={{ fontSize: fz(12), color: C.textMuted, fontFamily: 'monospace', marginBottom: 16 }}>
          {step.system} · {step.tool}
        </div>
      )}

      {isWrite && (
        <antd.Alert type="warning" showIcon style={{ marginBottom: 16 }}
          message={<span style={{ fontSize: fz(12), fontWeight: 600 }}>這一步不會真的送出</span>}
          description={<span style={{ fontSize: fz(12), lineHeight: 1.6 }}>寫入節點的試打只算得出「會送出什麼」。一個「試」的按鈕真的開了工單，整套人工確認就沒有意義了。</span>}
        />
      )}

      {/* ── 輸入 ── */}
      <div style={{ fontSize: fz(12), fontWeight: 600, color: C.textSub, marginBottom: 8 }}>
        {isCompute ? '上游資料（可直接改成你想試的值）' : '參數（可自己改）'}
      </div>

      {isCompute ? (
        <React.Fragment>
          {upstream && (
            <div style={{ fontSize: fz(11), color: C.textMuted, marginBottom: 4 }}>
              來自步驟 {upstream.step.num}「{upstream.step.label}」
            </div>
          )}
          <antd.Input.TextArea value={feed} onChange={function(e) { setFeed(e.target.value); }}
            autoSize={{ minRows: 3, maxRows: 6 }} style={{ fontFamily: 'monospace', fontSize: fz(12) }} />
          <div style={{ fontSize: fz(11), color: C.textMuted, marginTop: 8, lineHeight: 1.7 }}>
            自動出的情境是通則。真正會出事的那組值只有做過的人知道 —— 把它打進來試。
          </div>
        </React.Fragment>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {((spec && spec.params) || []).map(function(p) {
            return (
              <div key={p.key} style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ fontSize: fz(12), color: C.textSub, width: 96, flexShrink: 0 }}>{p.label}</span>
                <antd.Input size="small" value={params[p.key]}
                  onChange={function(e) { var v = e.target.value; setParams(function(prev) { var n = Object.assign({}, prev); n[p.key] = v; return n; }); }}
                  style={{ fontFamily: 'monospace', fontSize: fz(12) }} />
              </div>
            );
          })}
          {(!spec || (spec.params || []).length === 0) && (
            <div style={{ fontSize: fz(12), color: C.textMuted }}>這個工具不吃參數。</div>
          )}
        </div>
      )}

      <antd.Button type="primary" size="small" loading={busy} onClick={fire} style={{ marginTop: 16 }}>
        {isWrite ? '看會送出什麼' : '試打這一步'}
      </antd.Button>

      {/* ── 回傳 ── */}
      {out && (
        <div style={{ marginTop: 16, border: '1px solid ' + C.border, borderRadius: 8, overflow: 'hidden' }}>
          <div style={{ padding: '8px 16px', background: C.bgSub, fontSize: fz(12), fontWeight: 600, color: C.text }}>
            {isWrite ? '會送出的欄位' : (isCompute ? '算出來的結果' : '回傳 ' + (spec ? spec.rows : 0) + ' 筆')}
            <span style={{ fontWeight: 400, color: C.textMuted, marginLeft: 8 }}>{out.at}</span>
          </div>

          {isCompute ? (
            <div style={{ padding: '8px 16px' }}>
              <div style={{ fontSize: fz(12), color: C.textSub, lineHeight: 1.7 }}>
                算法：{calc ? calc.how : (step.note || '本節點的自訂邏輯')}
              </div>
              <div style={{ fontSize: fz(12), color: C.text, lineHeight: 1.7, marginTop: 4, fontFamily: 'monospace' }}>
                {feed.trim() === '' ? '（輸入是空的 —— 這個節點對空輸入怎麼反應，正是該測的）' : '依上述輸入完成計算'}
              </div>
            </div>
          ) : (
            <React.Fragment>
              {fields.map(function(f, i) {
                return (
                  <div key={f.name} style={{
                    padding: '8px 16px', borderTop: i > 0 ? '1px solid ' + C.border : 'none',
                    display: 'flex', alignItems: 'baseline', gap: 8, flexWrap: 'wrap',
                  }}>
                    <span style={{ fontSize: fz(12), fontFamily: 'monospace', color: C.text, fontWeight: 600 }}>{f.name}</span>
                    <span style={{ fontSize: fz(11), color: C.textMuted, fontFamily: 'monospace' }}>{f.type}</span>
                    <span style={{ fontSize: fz(12), color: C.textSub, flex: 1, minWidth: 0 }}>{f.note}</span>
                    {/* 沒有下游用到的欄位壞掉不痛，會痛的是這幾個 */}
                    {f.usedBy && (
                      <antd.Tag bordered={false} style={{ marginInlineEnd: 0, borderRadius: 999, fontSize: fz(10), color: '#2563EB', background: 'rgba(37,99,235,0.08)' }}>
                        {f.usedBy}
                      </antd.Tag>
                    )}
                  </div>
                );
              })}
              {spec && spec.sample && !isWrite && (
                <div style={{ padding: '8px 16px', borderTop: '1px solid ' + C.border, fontSize: fz(12), color: C.textMuted, fontFamily: 'monospace' }}>
                  第 1 筆：{spec.sample}
                </div>
              )}
              {fields.length === 0 && (
                <div style={{ padding: '8px 16px', fontSize: fz(12), color: C.textMuted }}>這個工具還沒登錄欄位定義。</div>
              )}
            </React.Fragment>
          )}
        </div>
      )}

      {/* ── 打出問題就地存成情境 ──
           我原本反對讓人自己加壞資料情境，因為那要人用文字描述「怎麼壞」，太技術。
           但如果是**打出來**的，輸入就在手上，只要補一句「這種時候應該怎麼樣」就成一題。 */}
      {out && !saved && (
        <div style={{ marginTop: 16, paddingTop: 16, borderTop: '1px solid ' + C.border }}>
          <div style={{ fontSize: fz(12), fontWeight: 600, color: C.textSub, marginBottom: 8 }}>
            這種時候應該怎麼樣？（填了就能存成一個情境）
          </div>
          <antd.Input.TextArea value={expect} onChange={function(e) { setExpect(e.target.value); }}
            autoSize={{ minRows: 2, maxRows: 3 }} placeholder="" />
          <antd.Button size="small" type="dashed" disabled={!expect.trim()} style={{ marginTop: 8 }}
            onClick={function() {
              onSaveScenario({
                id: 'sc-user-' + Date.now(),
                kind: 'user', origin: 'seed',
                label: '試打 · 步驟 ' + step.num + ' ' + step.label,
                inject: { stepNum: step.num, tool: step.tool || null, how: isCompute ? ('上游資料：' + feed) : Object.keys(params).map(function(k) { return k + '=' + params[k]; }).join(' · ') },
                expect: expect.trim(),
              });
              setSaved(true);
            }}>
            存成一個情境
          </antd.Button>
        </div>
      )}
      {saved && (
        <div style={{ marginTop: 16, fontSize: fz(12), color: '#22C55E', fontWeight: 600 }}>
          ✓ 已加進情境清單（待執行）。回到下面按一次「執行情境試跑」。
        </div>
      )}
    </antd.Modal>
  );
}

function SkillGraph({ skill, onSaveScenario }) {
  var { C, fz } = useTheme();
  var [probeStep, setProbeStep] = React.useState(null);
  var steps = skill.plainSteps || [];
  var edges = (skill.graph && skill.graph.edges) || [];
  if (steps.length === 0) {
    return <antd.Empty image={antd.Empty.PRESENTED_IMAGE_SIMPLE}
      description={<span style={{ fontSize: fz(13), color: C.textMuted }}>尚未產生流程圖</span>}
      style={{ padding: 24, background: C.bgPanel, borderRadius: 8, border: '1px solid ' + C.border, margin: 0 }} />;
  }
  var built = buildGraphLevels(steps, edges);
  /* 以最長路徑分層時每一層必定有節點，所以不做過濾 ——
     過濾會讓 level 索引與 rows 索引對不上。 */
  var rows = built.rows;
  var confirmCnt = steps.filter(function(s) { return s.needsConfirm; }).length;
  var customCnt  = steps.filter(function(s) { return s.source === 'custom'; }).length;

  return (
    <div>
      {/* 圖例：把「會碰到哪些系統」需要講的事收在這裡 */}
      <div style={{
        display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap',
        padding: '8px 16px', marginBottom: 16,
        border: '1px solid ' + C.border, borderRadius: 8, background: C.bgSub,
      }}>
        <span style={{ fontSize: fz(11), color: C.textMuted }}>圖例</span>
        <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
          <span style={{ width: 3, height: 14, background: '#2563EB', borderRadius: 2 }} />
          <span style={{ fontSize: fz(11), color: C.textSub }}>標準元件（已驗證，簽核可略過）</span>
        </span>
        <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
          <span style={{ width: 3, height: 14, background: '#F59E0B', borderRadius: 2 }} />
          <span style={{ fontSize: fz(11), color: C.textSub }}>本次自訂 {customCnt} 步（簽核重點）</span>
        </span>
        <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
          <span style={{ fontSize: fz(11) }}>🔒</span>
          <span style={{ fontSize: fz(11), color: C.textSub }}>需人工確認 {confirmCnt} 步</span>
        </span>
      </div>

      {/* 流程圖本體 */}
      <div style={{ border: '1px solid ' + C.border, borderRadius: 8, padding: '24px 24px', background: C.bgSub }}>
        <GraphTerminal label="開始" />
        {rows.map(function(row, i) {
          return (
            <React.Fragment key={i}>
              <GraphConnector rows={rows} level={built.level} edges={edges} band={i === 0 ? 'start' : i - 1} />
              <div style={{ display: 'flex', gap: 16, alignItems: 'stretch' }}>
                {row.map(function(s) { return <GraphNode key={s.num} step={s} onProbe={function() { setProbeStep(s); }} />; })}
              </div>
            </React.Fragment>
          );
        })}
        <GraphConnector rows={rows} level={built.level} edges={edges} band="end" />
        <GraphTerminal label="結束" />
      </div>

      {confirmCnt > 0 && (
        <div style={{ marginTop: 16, fontSize: fz(12), color: '#F59E0B', fontWeight: 600, lineHeight: 1.6 }}>
          ⚠️ 這 {confirmCnt} 個標了 🔒 的步驟會異動系統，執行到就會停下來等人按確認 —— 手動執行如此，排程執行也一樣。
        </div>
      )}
      <div style={{ marginTop: 8, fontSize: fz(12), color: C.textMuted, lineHeight: 1.6 }}>
        每個節點右上的 <span style={{ color: '#2563EB', fontWeight: 600 }}>▷ 試打</span> 可以單獨打這一步，看它實際吃什麼、吐什麼 —— 不用整份跑完再回推是哪一段的介面對不上。
      </div>

      {probeStep && (
        <ProbeModal skill={skill} step={probeStep}
          onClose={function() { setProbeStep(null); }}
          onSaveScenario={onSaveScenario || function() {}} />
      )}
    </div>
  );
}

/* ════════════════════════════════════════
