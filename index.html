                onClick={() => setParentTaskModal(null)}
                style={{ width: 24, height: 24, borderRadius: 6, border: 'none', background: '#F5F5F5', color: '#9E9E9E', cursor: 'pointer', fontSize: fz(14), display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}
              >✕</button>
            </div>

            {/* Sub-task list */}
            <div style={{ flex: 1, overflowY: 'auto', padding: '12px 16px' }}>
              {parentTaskModal.subTasks && parentTaskModal.subTasks.length > 0 ? (
                <>
                  {/* Progress summary */}
                  {(() => {
                    const total = parentTaskModal.subTasks.length;
                    const done  = parentTaskModal.subTasks.filter(s => s.status === 'done').length;
                    return (
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}>
                        <span style={{ fontSize: fz(12), color: '#9E9E9E' }}>子任務進度</span>
                        <span style={{ fontSize: fz(12), fontWeight: 600, color: done === total ? '#22C55E' : '#2563EB' }}>{done}/{total} 完成</span>
                        {/* Progress bar */}
                        <div style={{ flex: 1, height: 4, background: '#F0F0F0', borderRadius: 2, overflow: 'hidden' }}>
                          <div style={{ height: '100%', width: `${Math.round((done/total)*100)}%`, background: done === total ? '#22C55E' : '#2563EB', borderRadius: 2 }} />
                        </div>
                      </div>
                    );
                  })()}
                  {/* Sub-task rows */}
                  {parentTaskModal.subTasks.map(sub => {
                    const stColor = { pending: '#9E9E9E', in_progress: '#2563EB', done: '#22C55E', overdue: '#F97316' }[sub.status] || '#9E9E9E';
                    const stLabel = { pending: '未開始', in_progress: '進行中', done: '已完成', overdue: '逾期' }[sub.status] || sub.status;
                    return (
                      <div key={sub.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 0', borderBottom: '1px solid #F5F5F5' }}>
                        {/* Status dot */}
                        <div style={{ width: 10, height: 10, borderRadius: '50%', background: stColor, flexShrink: 0 }} />
                        {/* Title */}
                        <span style={{ flex: 1, fontSize: fz(13), color: sub.status === 'done' ? '#9E9E9E' : '#1A1A1A', textDecoration: sub.status === 'done' ? 'line-through' : 'none' }}>{sub.title}</span>
                        {/* Assignee */}
                        <span style={{ fontSize: fz(11), color: '#9E9E9E', flexShrink: 0 }}>{sub.assignee}</span>
                        {/* Status label */}
                        <span style={{ fontSize: fz(11), fontWeight: 600, color: stColor, flexShrink: 0 }}>{stLabel}</span>
                      </div>
                    );
                  })}
                </>
              ) : (
                <div style={{ textAlign: 'center', color: '#9E9E9E', fontSize: fz(13), padding: '24px 0' }}>此任務沒有子任務</div>
              )}
            </div>

            {/* Footer */}
            <div style={{ padding: '12px 16px', borderTop: '1px solid #E0E0E0', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <button
                onClick={() => setParentTaskModal(null)}
                style={{ padding: '6px 16px', borderRadius: 6, border: '1px solid #E0E0E0', background: '#FFFFFF', color: '#666666', fontSize: fz(12), cursor: 'pointer' }}
              >關閉</button>
              {typeof onGoParentTask === 'function' && (
                <button
                  onClick={() => { const id = parentTaskModal.id; setParentTaskModal(null); onGoParentTask('', id); }}
                  style={{ padding: '6px 16px', borderRadius: 6, border: 'none', background: '#2563EB', color: '#FFFFFF', fontSize: fz(12), fontWeight: 600, cursor: 'pointer' }}
                >前往任務管理 →</button>
              )}
            </div>
          </div>
        </div>
      )}

      {/* ── Add Task Modal ── */}
      {showAddModal && (
        <div
          onClick={() => setShowAddModal(false)}
          style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.28)', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'center' }}
        >
          <div onClick={e => e.stopPropagation()} style={{
            background: C.bg, borderRadius: 8, width: 360, maxWidth: '90vw', border: '1px solid ' + C.border,
          }}>
            {/* Header */}
            <div style={{ padding: '12px 16px', borderBottom: '1px solid ' + C.border, display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontSize: fz(13), fontWeight: 600, color: C.text, flex: 1 }}>新增任務</span>
              <button onClick={() => setShowAddModal(false)} style={{ width: 24, height: 24, borderRadius: 6, border: 'none', background: C.bgPanel, color: C.textMuted, cursor: 'pointer', fontSize: fz(14), display: 'flex', alignItems: 'center', justifyContent: 'center' }}>✕</button>
            </div>
            {/* Form */}
            <div style={{ padding: 16, display: 'flex', flexDirection: 'column', gap: 12 }}>
              {/* Title */}
              <div>
                <label style={{ fontSize: fz(11), fontWeight: 600, color: C.textSub, display: 'block', marginBottom: 4 }}>任務標題 <span style={{ color: '#EF4444' }}>*</span></label>
                <input
                  value={addForm.title}
                  onChange={e => setAddForm(f => ({ ...f, title: e.target.value }))}
                  placeholder="輸入任務標題…"
                  autoFocus
                  style={{ width: '100%', boxSizing: 'border-box', fontSize: fz(13), color: C.textSub, border: '1px solid ' + C.border, borderRadius: 6, padding: '6px 10px', outline: 'none', fontFamily: 'inherit' }}
                />
              </div>
              {/* Priority */}
              <div>
                <label style={{ fontSize: fz(11), fontWeight: 600, color: C.textSub, display: 'block', marginBottom: 4 }}>優先級</label>
                <div style={{ display: 'flex', gap: 8 }}>
                  {['P1', 'P2', 'P3'].map(pr => {
                    const prColor = { P1: '#EF4444', P2: '#F59E0B', P3: '#9E9E9E' }[pr];
                    const prBg    = { P1: 'rgba(239,68,68,0.08)', P2: 'rgba(245,158,11,0.08)', P3: 'rgba(158,158,158,0.08)' }[pr];
                    const active  = addForm.priority === pr;

                        border: `1px solid ${active ? prColor : '#E0E0E0'}`,
                        background: active ? prBg : '#FFFFFF',
                        color: active ? prColor : C.textMuted,
                      }}>{pr}</button>
                    );
                  })}
                </div>
              </div>
              {/* Due Date */}
              <div>
                <label style={{ fontSize: fz(11), fontWeight: 600, color: C.textSub, display: 'block', marginBottom: 4 }}>截止日期</label>
                <input
                  type="date"
                  value={addForm.dueDate}
                  onChange={e => setAddForm(f => ({ ...f, dueDate: e.target.value }))}
                  style={{ width: '100%', boxSizing: 'border-box', fontSize: fz(13), color: C.textSub, border: '1px solid ' + C.border, borderRadius: 6, padding: '6px 10px', outline: 'none', fontFamily: 'inherit' }}
                />
              </div>
              {/* Assignee */}
              <div>
                <label style={{ fontSize: fz(11), fontWeight: 600, color: C.textSub, display: 'block', marginBottom: 4 }}>指派給</label>
                <select
                  value={addForm.assignee}
                  onChange={e => setAddForm(f => ({ ...f, assignee: e.target.value }))}
                  style={{ width: '100%', boxSizing: 'border-box', fontSize: fz(13), color: C.textSub, border: '1px solid ' + C.border, borderRadius: 6, padding: '6px 10px', outline: 'none', fontFamily: 'inherit', background: C.bg }}
                >
                  {(p.members && p.members.length > 0 ? p.members : [{ name: p.name }]).map(m => (
                    <option key={m.name} value={m.name}>{m.name}{m.name === p.name ? '（我）' : ''}</option>
                  ))}
                </select>
              </div>
              {/* Buttons */}
              <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end', marginTop: 4 }}>
                <button onClick={() => setShowAddModal(false)} style={{ padding: '6px 16px', borderRadius: 6, border: '1px solid ' + C.border, background: C.bg, color: C.textSub, fontSize: fz(12), cursor: 'pointer' }}>取消</button>
                <button
                  onClick={handleAddSubmit}
                  disabled={!addForm.title.trim()}
                  style={{
                    padding: '6px 16px', borderRadius: 6, border: 'none',
                    background: addForm.title.trim() ? '#2563EB' : '#E0E0E0',
                    color: addForm.title.trim() ? '#FFFFFF' : C.textMuted,

          </div>
        </div>
      )}
    </div>
  );
}

/* ── ShiftHandoverModal ── */
const NEXT_SHIFT = { '日班': '小夜班', '小夜班': '大夜班', '大夜班': '日班' };

function ShiftHandoverModal({ p, onClose, onSubmit}) {
  var { C, fz } = useTheme();
  const currentShift = p.currentShift || '日班';
  const nextShift    = NEXT_SHIFT[currentShift] || '下一班';

  const [loading, setLoading]       = React.useState(true);
  const [situation, setSituation]   = React.useState('');   // 區塊一：本班課況
  const [pending, setPending]       = React.useState('');   // 區塊二：遺留待追蹤
  const [notes, setNotes]           = React.useState('');   // 區塊三：下一班注意事項

  /* SOP 已經算好的那份（Schedule 產出＝佈告欄那則）；有的話直接預填，
     人只要補判斷與交代事項 —— 數字機器算，判斷人給。 */
  const sopReport = getLatestHandoverReport(p.key);

  React.useEffect(() => {
    const timer = setTimeout(() => {
      if (sopReport && sopReport.output) {
        setSituation(sopReport.output.situation || '');
        setPending(sopReport.output.pending || '');
        setLoading(false);
        return;
      }

      // ── 區塊一：本班課況（KPI warn + Must-be-zero）── 沒有 SOP 產出時的退路
      const warnKpis  = (p.kpis || []).filter(k => k.status === 'warn');
      const alertMbz  = (p.mustBeZero || []).filter(m => !m.ok);
      let sitLines = [];
      if (warnKpis.length > 0) {
        sitLines.push('【KPI 未達標】' + warnKpis.map(k => `${k.label} ${k.value}${k.unit}（${k.target}）`).join('、') + '。');
      } else {
        sitLines.push('本班各項 KPI 皆達標。');
      }
      if (alertMbz.length > 0) {
        sitLines.push('【Must-be-zero 異常】' + alertMbz.map(m => m.label).join('、') + ' 目前有異常。');
      } else {
        sitLines.push('Must-be-zero 全數歸零，無異常。');
      }
      setSituation(sitLines.join('\n'));

      // ── 區塊二：遺留待追蹤事項 ──
      const p1Items  = (p.priorityFeed || []).filter(t => t.priority === 'P1');
      const mbzItems = (p.mustBeZero  || []).filter(m => !m.ok);
      let pendLines = [];
      mbzItems.forEach(m => pendLines.push(`• ${m.label}（${m.value}）尚未歸零，${nextShift}請持續追蹤。`));
      p1Items.forEach(t  => pendLines.push(`• ${t.title}（${t.source}）本班尚未結案。`));
      setPending(pendLines.length > 0 ? pendLines.join('\n') : '本班無遺留待追蹤事項。');

      setLoading(false);
    }, 800);
    return () => clearTimeout(timer);
  }, []);

  const handleSubmit = () => onSubmit({ currentShift, nextShift, situation, pending, notes });

  const SectionLabel = ({ children, badge }) => (
    <div style={{ fontSize: fz(11), fontWeight: 700, color: C.textMuted, marginBottom: 8, display: 'flex', alignItems: 'center', gap: 6, textTransform: 'uppercase', letterSpacing: '0.06em' }}>
      {children}
      {badge && <span style={{ fontSize: fz(10), fontWeight: 600, padding: '1px 6px', borderRadius: 999, background: '#EFF6FF', color: '#2563EB', textTransform: 'none', letterSpacing: 0 }}>{badge}</span>}
    </div>
  );

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.3)', zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center' }}
      onClick={onClose}
    >
      <div className="fade-in" style={{ background: C.bg, border: '1px solid ' + C.border, borderRadius: 8, width: 576, maxHeight: '84vh', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}
        onClick={e => e.stopPropagation()}
      >
        {/* Header */}
        <div style={{ padding: '16px', borderBottom: '1px solid ' + C.border, display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0 }}>
          <div>
            <div style={{ fontSize: fz(14), fontWeight: 600, color: C.text }}>班對班交班摘要</div>
            <div style={{ fontSize: fz(11), color: C.textMuted, marginTop: 2 }}>
              {currentShift} → {nextShift} · {p.name}
              {sopReport && <span style={{ color: '#2563EB' }}>　·　已由 SOP「{sopReport.scheduleName}」預填（{sopReport.dateLabel}）</span>}
            </div>
          </div>
          {loading && <span style={{ fontSize: fz(11), color: C.textMuted, marginLeft: 8 }}>{sopReport ? '正在載入 SOP 產出…' : 'AI 正在彙整本班課況…'}</span>}
          <button onClick={onClose}
            style={{ marginLeft: 'auto', background: 'none', border: 'none', cursor: 'pointer', fontSize: fz(18), color: C.textMuted, padding: '0 4px', lineHeight: 1 }}>×</button>
        </div>

        {/* Body */}
        <div style={{ flex: 1, overflowY: 'auto', padding: 16, display: 'flex', flexDirection: 'column', gap: 16 }} className="scrollbar-thin">
          {loading ? (
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '48px 0', gap: 16 }}>
              <div className="spin" style={{ width: 32, height: 32, border: '3px solid ' + C.border, borderTopColor: '#2563EB', borderRadius: '50%' }} />
              <span style={{ fontSize: fz(13), color: C.textMuted }}>{sopReport ? "正在載入 SOP 已產出的 " + currentShift + " 課況…" : "AI 正在彙整 " + currentShift + " 課況…"}</span>
            </div>
          ) : (
            <>
              {/* 區塊一：本班課況 */}
              <div>
                <SectionLabel badge={sopReport ? "SOP 已算好 · 可編輯" : "AI 生成 · 可編輯"}>本班課況</SectionLabel>
                <textarea value={situation} onChange={e => setSituation(e.target.value)}
                  style={{ width: '100%', minHeight: 88, padding: 10, border: '1px solid ' + C.border, borderRadius: 6, fontSize: fz(13), color: C.textSub, lineHeight: 1.6, resize: 'vertical', outline: 'none', boxSizing: 'border-box', fontFamily: 'inherit' }} />
              </div>

              {/* 區塊二：遺留待追蹤事項 */}
              <div>
                <SectionLabel badge={sopReport ? "SOP 已算好 · 可編輯" : "AI 生成 · 可編輯"}>遺留待追蹤事項</SectionLabel>
                <textarea value={pending} onChange={e => setPending(e.target.value)}
                  style={{ width: '100%', minHeight: 104, padding: 10, border: '1px solid ' + C.border, borderRadius: 6, fontSize: fz(13), color: C.textSub, lineHeight: 1.6, resize: 'vertical', outline: 'none', boxSizing: 'border-box', fontFamily: 'inherit' }} />
              </div>

              {/* 區塊三：下一班注意事項（動態標籤） */}
              <div>
                <SectionLabel>{nextShift}注意事項（選填）</SectionLabel>
                <textarea value={notes} onChange={e => { if (e.target.value.length <= 500) setNotes(e.target.value); }}
                  placeholder={`請輸入交代給${nextShift}的特殊注意事項…`}
                  style={{ width: '100%', minHeight: 72, padding: 10, border: '1px solid ' + C.border, borderRadius: 6, fontSize: fz(13), color: C.textSub, lineHeight: 1.6, resize: 'vertical', outline: 'none', boxSizing: 'border-box', fontFamily: 'inherit' }} />
                <div style={{ fontSize: fz(11), color: C.textMuted, textAlign: 'right', marginTop: 4 }}>{notes.length} / 500</div>
              </div>
            </>
          )}
        </div>

        {/* Footer */}
        <div style={{ padding: '12px 16px', borderTop: '1px solid ' + C.border, display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
          <span style={{ fontSize: fz(11), color: C.textMuted }}>送出後將發布至課佈告欄，供{nextShift}全員確認。</span>
          <div style={{ display: 'flex', gap: 8 }}>
            <button onClick={onClose}
              style={{ padding: '6px 16px', borderRadius: 6, border: '1px solid ' + C.border, background: C.bg, color: C.textSub, fontSize: fz(13), fontWeight: 600, cursor: 'pointer' }}
              onMouseEnter={e => e.currentTarget.style.background = '#F9FAFB'}
              onMouseLeave={e => e.currentTarget.style.background = '#FFFFFF'}
            >取消</button>
            <button onClick={handleSubmit} disabled={loading}
              style={{ padding: '6px 16px', borderRadius: 6, border: 'none', background: loading ? '#D1D5DB' : '#2563EB', color: '#FFFFFF', fontSize: fz(13), fontWeight: 600, cursor: loading ? 'not-allowed' : 'pointer' }}
              onMouseEnter={e => { if (!loading) e.currentTarget.style.background = '#1D4ED8'; }}
              onMouseLeave={e => { if (!loading) e.currentTarget.style.background = '#2563EB'; }}
            >✓ 確認送出</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── renderHomeWidget: dispatch by slot.type ── */
/* rowId 是為了讓 custom widget 的 onEdit 能帶出精確的 { rowId, slotId }，供 HomeLayoutTab 自動展開對應設定面板 */
function renderHomeWidget(slot, rp, rowId) {
  var { C, fz } = useTheme();
  switch (slot.type) {
    case 'announcement': return <BulletinWidget p={rp.p} handoverRecord={rp.handoverRecord} onEdit={rp.onOpenBulletinSetting} onOpenHandover={rp.onOpenHandover} />;
    case 'tool':         return <ToolStatusWidget p={rp.p} />;
    case 'case':         return <CaseWidget p={rp.p} />;
    case 'lot':          return <LotHoldWidget p={rp.p} />;
    case 'kpi':          return <KpiSummaryWidget p={rp.p} kpiConfig={rp.kpiConfig} onEdit={rp.kpiConfig && rp.onOpenKpiSetting ? rp.onOpenKpiSetting : undefined} />;
    case 'app':          return <AppLauncherWidget p={rp.p} onEdit={rp.onOpenAppSetting} />;
    case 'custom':       return <LinkWidgetCard widget={slot} onEdit={function() { rp.onOpenLinkWidgetSetting({ rowId: rowId, slotId: slot.slotId }); }} />;
    default:             return null;
  }
}

/* ── DashboardPage ── */
function DashboardPage({ p, onAskAI, handoverRecord, onHandoverSubmit, pinnedAppIds, onGoAppCenter, kpiConfig, onKpiConfigChange, onOpenKpiSetting, onOpenBulletinSetting, onOpenAppSetting, onOpenLinkWidgetSetting, showHandoverModal, setShowHandoverModal, homeLayout, onGoTasks}) {
  var { C, fz } = useTheme();
  const handleModalSubmit = ({ currentShift, nextShift, situation, pending, notes }) => {
    const now = new Date();
    const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
    let content = `【本班課況】\n${situation}`;
    content += `\n\n【遺留待追蹤事項】\n${pending}`;
    if (notes.trim()) content += `\n\n【${nextShift}注意事項】\n${notes.trim()}`;
    if (onHandoverSubmit) onHandoverSubmit({
      id: 'handover-' + Date.now(),
      author: p.user.name, av: p.user.avatar, avColor: p.accentColor,
      role: 'all', pinned: true, isRead: false, type: 'handover',
      title: `[交班記錄] ${currentShift} → ${nextShift}，今天 ${timeStr}`,
      content, time: `今天 ${timeStr}`,
      readCount: 1, totalCount: p.members ? p.members.length : 5,
    });
    if (setShowHandoverModal) setShowHandoverModal(false);
  };

  var rp = {
    p, handoverRecord, kpiConfig,
    onOpenBulletinSetting, onOpenKpiSetting, onOpenAppSetting, onOpenLinkWidgetSetting,
    /* 佈告欄那則 SOP 產出上的「補充交代事項」＝交班 Modal 的入口 */
    onOpenHandover: function() { if (setShowHandoverModal) setShowHandoverModal(true); },
  };
  const [rightOpen, setRightOpen] = React.useState(true);

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0 }}>
      {showHandoverModal && (
        <ShiftHandoverModal p={p} onClose={() => setShowHandoverModal && setShowHandoverModal(false)} onSubmit={handleModalSubmit} />
      )}
      <div style={{ flex: 1, display: 'flex', minHeight: 0, overflow: 'hidden' }}>
        {/* LEFT — Dynamic Layout */}
        <div style={{ flex: 1, overflowY: 'auto', padding: 16, display: 'flex', flexDirection: 'column', gap: 8 }} className="scrollbar-thin">
          {(homeLayout || []).map(function(row) {
            return (
              <div key={row.rowId} style={{ display: 'flex', gap: 8 }}>
                {row.widgets.map(function(slot) {
                  return (
                    <div key={slot.slotId} style={{ flex: 1, minWidth: 0 }}>
                      {renderHomeWidget(slot, rp, row.rowId)}
                    </div>
                  );

              </div>
            );
          })}
        </div>
        {/* Divider + collapse toggle tab */}
        <div style={{ position: 'relative', width: 1, background: C.border, flexShrink: 0 }}>
          <button
            onClick={() => setRightOpen(o => !o)}

              color: C.textMuted, fontSize: fz(10), zIndex: 10,

            onMouseEnter={e => { e.currentTarget.style.background = '#F5F5F5'; e.currentTarget.style.color = C.textSub; }}
            onMouseLeave={e => { e.currentTarget.style.background = '#FFFFFF'; e.currentTarget.style.color = C.textMuted; }}

      <div style={{ flex: 1, display: 'flex', minHeight: 0, overflow: 'hidden' }}>

        {/* LEFT — Bookmark list */}
        <div style={{
          width: 240, borderRight: '1px solid ' + C.border,
          display: 'flex', flexDirection: 'column',
          background: C.bg, flexShrink: 0,
        }}>
          {/* Search — 以 inline label 取代 placeholder 代 label（guideline） */}
          <div style={{ padding: 16, borderBottom: '1px solid ' + C.border, flexShrink: 0 }}>
            <div style={{ fontSize: fz(13), fontWeight: 700, color: C.text, marginBottom: 8 }}>書籤清單</div>
            <antd.Input
              size="small"
              value={searchVal}
              onChange={e => setSearchVal(e.target.value)}
              allowClear
              aria-label="搜尋報表"
              prefix={<span style={{ color: C.textMuted, fontSize: fz(12) }}>🔍</span>}
              placeholder="報表名稱"
            />
          </div>

          {/* Groups — 每組一個 List（維持分組資訊架構） */}
          <div style={{ flex: 1, overflowY: 'auto', padding: '8px 0' }} className="scrollbar-thin">
            {filteredGroups.map(grp => (
              <div key={grp.label}>
                <div style={{
                  fontSize: fz(10), fontWeight: 700, color: C.textMuted,
                  letterSpacing: '0.08em', textTransform: 'uppercase',
                  padding: '8px 16px 4px',
                }}>{grp.label}</div>
                <antd.List
                  dataSource={grp.items}
                  split={false}
                  locale={{ emptyText: <antd.Empty image={antd.Empty.PRESENTED_IMAGE_SIMPLE} description={<span style={{ fontSize: fz(12), color: C.textMuted }}>沒有符合的報表</span>} /> }}
                  renderItem={item => {
                    const isActive = activeId === item.id;
                    return (
                      <antd.List.Item
                        onClick={() => setActiveId(item.id)}
                        style={{
                          padding: '8px 16px', cursor: 'pointer', borderBlockEnd: 'none',
                          backgroundColor: isActive ? C.hoverAccent : 'transparent',
                          borderLeft: isActive ? '3px solid #2563EB' : '3px solid transparent',
                        }}
                        onMouseEnter={e => { if (!isActive) e.currentTarget.style.backgroundColor = C.hover; }}
                        onMouseLeave={e => { if (!isActive) e.currentTarget.style.backgroundColor = 'transparent'; }}
                      >
                        <div style={{ display: 'flex', alignItems: 'center', gap: 8, width: '100%', minWidth: 0 }}>
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{
                              fontSize: fz(13), fontWeight: isActive ? 600 : 400,
                              color: isActive ? '#2563EB' : C.textSub,
                              overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                            }}>{item.name}</div>
                            <div style={{ fontSize: fz(10), color: C.textMuted }}>{item.sub}</div>
                          </div>
                          <KpiSrcTag src={item.src} size={9} />
                        </div>
                      </antd.List.Item>
                    );
                  }}
                />
              </div>
            ))}
          </div>

          {/* Footer */}
          <div style={{ padding: '12px 16px', borderTop: '1px solid ' + C.border, fontSize: fz(11), color: C.textMuted, flexShrink: 0 }}>
            ⚙ Seed 管理書籤與分類
          </div>
        </div>

        {/* RIGHT — Report view */}
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>

          {/* Report toolbar */}
          <div style={{
            background: C.bg, borderBottom: '1px solid ' + C.border,
            padding: '0 24px', height: 48,
            display: 'flex', alignItems: 'center', gap: 12, flexShrink: 0,
          }}>
            <span style={{ fontSize: fz(15), fontWeight: 600, color: C.text }}>{demo.title}</span>
            <KpiSrcTag src={demo.src} size={10} />
            <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontSize: fz(11), color: C.textMuted }}>更新 {demo.updated}</span>
              {onAskAI && (
                <antd.Button size="small" onClick={handleKpiAskAI} style={{ color: '#2563EB', borderColor: 'rgba(37,99,235,0.4)' }}>
                  ✦ Ask AI
                </antd.Button>
              )}
              <antd.Button size="small">↗ 在原系統開啟</antd.Button>
            </div>
          </div>

          {/* Embedded report frame */}
          <div style={{
            flex: 1, overflow: 'hidden', margin: 16, borderRadius: 8,
            border: '1px solid ' + C.border, display: 'flex', flexDirection: 'column', background: C.bg,
          }}>
            {/* Mock system topbar — 刻意保留自製：此處在模擬「外部報表系統」的
                介面（PBI / FDC / SPC 的 iframe chrome），不套用本產品的設計語言，
                否則會看不出是嵌入的他系統畫面。 */}
            <div style={{
              background: C.bgPanel, borderBottom: '1px solid ' + C.border,
              padding: '8px 16px', display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0,
            }}>
              <span style={{ fontSize: fz(12), fontWeight: 700, color: KPI_SRC_CFG[demo.src].color }}>{KPI_SRC_CFG[demo.src].label}</span>
              <span style={{ fontSize: fz(12), color: C.textSub }}>{demo.title}</span>
              <div style={{ marginLeft: 'auto', display: 'flex', gap: 0 }}>
                {['概覽', '趨勢', '明細'].map((tab, ti) => (
                  <span key={tab} style={{
                    fontSize: fz(11), padding: '3px 12px', cursor: 'pointer',
                    color: ti === 0 ? '#2563EB' : '#6B7280',
                    borderBottom: ti === 0 ? '2px solid #2563EB' : '2px solid transparent',
                    fontWeight: ti === 0 ? 600 : 400,
                  }}>{tab}</span>
                ))}
              </div>
            </div>

            {/* Report body */}
            <div style={{ flex: 1, overflowY: 'auto', padding: 16, background: C.bgSub, display: 'flex', flexDirection: 'column', gap: 16 }} className="scrollbar-thin">

              {/* KPI summary cards */}
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16 }}>
                {demo.cards.map((card, i) => (
                  <antd.Card key={i} size="small" styles={{ body: { padding: 16 } }}
                    style={{ borderColor: card.bad ? 'rgba(239,68,68,0.25)' : C.border }}>
                    <antd.Statistic
                      title={<span style={{ fontSize: fz(11), color: C.textMuted }}>{card.label}</span>}
                      value={card.value}
                      suffix={<span style={{ fontSize: fz(13), fontWeight: 400, color: C.textMuted }}>{card.unit}</span>}
                      valueStyle={{ fontSize: fz(24), fontWeight: 700, lineHeight: 1, color: card.bad ? '#EF4444' : C.text }}
                    />
                    <div style={{
                      fontSize: fz(12), marginTop: 8,
                      color: card.bad ? '#EF4444'
                           : (card.delta.startsWith('▲') || card.delta.startsWith('▼')) ? '#10B981'
                           : C.textMuted,
                    }}>{card.delta}</div>
                    <div style={{ fontSize: fz(11), color: C.textMuted }}>{card.target}</div>
                  </antd.Card>
                ))}
              </div>

              {/* Chart + Summary */}
              <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: 16 }}>

                {/* Bar chart — 長條圖本體保留自製（AntD 無圖表元件） */}
                <antd.Card size="small" styles={{ body: { padding: 16 } }}>
                  <div style={{ fontSize: fz(13), fontWeight: 600, color: C.text, marginBottom: 4 }}>
                    {demo.title} — 近 12 日趨勢
                  </div>
                  <div style={{ fontSize: fz(11), color: C.textMuted, marginBottom: 16 }}>
                    來源：{KPI_SRC_CFG[demo.src].label} · 每日更新
                  </div>
                  <div style={{ display: 'flex', alignItems: 'flex-end', gap: 3, height: 88 }}>
                    {demo.bars.map((v, i) => {
                      const range = maxBar - minBar || 1;
                      const h = Math.max(16, ((v - minBar + range * 0.1) / (range * 1.2)) * 80);
                      const isToday = i === demo.bars.length - 1;
                      const isBad = v < demo.target;
                      return (
                        <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2 }}>
                          <div
                            title={`${demo.barLabels[i]}: ${v}`}
                            style={{
                              width: '100%', height: h, borderRadius: '3px 3px 0 0', cursor: 'pointer',
                              background: isToday ? '#2563EB' : isBad ? '#FCA5A5' : '#BFDBFE',
                            }}
                          />
                          <div style={{ fontSize: fz(9), color: C.textMuted, whiteSpace: 'nowrap' }}>
                            {demo.barLabels[i]}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                  <div style={{ marginTop: 8, display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                    {[['#BFDBFE','達標'],['#FCA5A5','未達標'],['#2563EB','今日']].map(([bg, label]) => (
                      <div key={label} style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                        <div style={{ width: 10, height: 10, borderRadius: 2, background: bg }} />
                        <span style={{ fontSize: fz(11), color: C.textMuted }}>{label}</span>
                      </div>
                    ))}
                    <span style={{ fontSize: fz(11), color: C.textMuted, marginLeft: 8 }}>目標線 {demo.target}</span>
                  </div>
                </antd.Card>

                {/* Status summary */}
                <antd.Card size="small" style={{ height: '100%' }}
                  styles={{ body: { padding: 16, display: 'flex', flexDirection: 'column', gap: 8, height: '100%' } }}>
                  <div style={{ fontSize: fz(13), fontWeight: 600, color: C.text }}>異常摘要</div>
                  {abnormal.length > 0 ? (
                    <antd.List
                      dataSource={abnormal}
                      split={false}
                      renderItem={m => (
                        <antd.List.Item style={{ padding: '4px 0', borderBlockEnd: 'none' }}>
                          <div style={{ display: 'flex', alignItems: 'center', gap: 8, width: '100%' }}>
                            <antd.Badge color="#EF4444" />
                            <span style={{ fontSize: fz(12), color: C.textSub, flex: 1 }}>{m.label}</span>
                            <span style={{ fontSize: fz(12), fontWeight: 700, color: '#EF4444' }}>{m.value}</span>
                          </div>
                        </antd.List.Item>
                      )}
                    />
                  ) : (
                    <div style={{ fontSize: fz(12), color: '#10B981', display: 'flex', alignItems: 'center', gap: 8 }}>
                      <antd.Badge color="#10B981" />
                      所有指標正常
                    </div>
                  )}
                  <div style={{ marginTop: 'auto', paddingTop: 8, borderTop: '1px solid ' + C.border }}>
                    <div style={{ fontSize: fz(11), color: C.textMuted }}>最後更新</div>
                    <div style={{ fontSize: fz(12), color: C.textSub, fontWeight: 500, marginTop: 2 }}>{demo.updated} 前</div>
                  </div>
                </antd.Card>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════
   KNOWLEDGE PAGE
   AntD 遷移 Phase 4（見 brain/concepts/antd-migration-plan.md）

function KnowledgePage({ p, onSOPManage}) {
  var { C, fz } = useTheme();
  const [tab, setTab] = React.useState('sop');
  const tabs = [
    { k: 'sop', l: 'Skill', n: p.knowledge.sops.length },
    { k: 'prompt', l: 'Prompt 模板', n: p.knowledge.prompts.length },
    { k: 'qa', l: 'Q&A 條目', n: p.knowledge.qa.length },
  ];

  /* 膠囊 tabs → Segmented；選中背景 #2563EB（guideline 要求真 tabs 用主色），
     以巢狀 ConfigProvider 侷限本頁，不動其他頁的篩選型 Segmented。 */
  const segOptions = tabs.map(function (t) {
    const isActive = tab === t.k;
    return {
      value: t.k,
      label: (
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}>
          {t.l}
          <span style={{
            fontSize: fz(11), padding: '0 8px', borderRadius: 999, lineHeight: '16px',
            /* 用 backgroundColor（非 background shorthand）：切換分頁重繪時
               與 AntD 內部設定的 backgroundColor 混用會觸發 React 警告 */
            backgroundColor: isActive ? 'rgba(255,255,255,0.25)' : C.hover,
            color: isActive ? '#FFFFFF' : C.textMuted,
          }}>{t.n}</span>
        </span>
      ),
    };
  });

  /* ── Skill 卡片 ── */
  function renderSop(sop, i) {
    return (
      <antd.List.Item key={i} style={{ padding: '0 0 8px', borderBlockEnd: 'none' }}>
        <antd.Card size="small" style={{ width: '100%' }} styles={{ body: { padding: 16 } }}>
          <div style={{ display: 'flex', gap: 8 }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <antd.Space size={8} wrap style={{ marginBottom: 8 }}>
                <span style={{ fontWeight: 500, fontSize: fz(14), color: C.text }}>{sop.title}</span>
                <antd.Tag style={{ marginInlineEnd: 0, borderRadius: 999, color: sop.statusColor, background: sop.statusBg, borderColor: 'transparent' }}>
                  {sop.statusLabel}
                </antd.Tag>
                <span style={{ fontSize: fz(12), color: C.textMuted }}>{sop.version}</span>
              </antd.Space>
              {sop.feedback && (
                <antd.Alert type="warning" showIcon message={sop.feedback} style={{ marginBottom: 8, padding: '4px 8px' }} />
              )}
              <div style={{ fontSize: fz(14), color: C.textSub, marginBottom: 8 }}>{sop.desc}</div>
              <antd.Space size={8} wrap>
                <antd.Space size={4} wrap>
                  {sop.tags.map(function (t) { return <antd.Tag key={t} style={{ marginInlineEnd: 0 }}>{t}</antd.Tag>; })}
                </antd.Space>
                <span style={{ fontSize: fz(12), color: C.textMuted }}>更新 {sop.updated}</span>
                <span style={{ fontSize: fz(12), color: C.textMuted }}>負責 {sop.owner}</span>
                <span style={{ fontSize: fz(12), color: C.textMuted }}>查詢 {sop.usage} 次</span>
              </antd.Space>
            </div>
            <antd.Space size={8} align="start" style={{ flexShrink: 0 }}>
              <antd.Button size="small" style={{ color: p.accentColor, borderColor: p.accentBorder, background: p.accentBg }}>✦ AI 問這份</antd.Button>
              <antd.Button size="small">查看</antd.Button>
            </antd.Space>
          </div>
        </antd.Card>
      </antd.List.Item>
    );
  }

  /* ── Prompt 卡片 ── */
  function renderPrompt(pr, i) {
    return (
      <antd.List.Item key={i} style={{ padding: '0 0 8px', borderBlockEnd: 'none' }}>
        <antd.Card size="small" style={{ width: '100%' }} styles={{ body: { padding: 16 } }}>
          <div style={{ display: 'flex', gap: 8 }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <antd.Space size={8} wrap style={{ marginBottom: 8 }}>
                <span style={{ fontWeight: 500, fontSize: fz(14), color: C.text }}>{pr.label}</span>
                {pr.saved && (
                  <antd.Tag color="warning" style={{ marginInlineEnd: 0, borderRadius: 999 }}>★ 已加入捷徑</antd.Tag>
                )}
                <antd.Tag style={{ marginInlineEnd: 0 }}>{pr.category}</antd.Tag>
              </antd.Space>
              {/* Prompt 原文：guideline 要求以 monospace 呈現 */}
              <div style={{
                fontSize: fz(13), color: C.textSub, background: C.bgSub,
                border: '1px solid ' + C.border, borderRadius: 4,
                padding: 8, marginBottom: 8, fontFamily: 'monospace', lineHeight: 1.6,
              }}>{pr.text}</div>
              <div style={{ fontSize: fz(12), color: C.textMuted }}>貢獻 {pr.contributor} · 已使用 {pr.usage} 次</div>
            </div>
            <antd.Space size={8} align="start" style={{ flexShrink: 0 }}>
              <antd.Button size="small" style={{ color: p.accentColor, borderColor: p.accentBorder, background: p.accentBg }}>使用</antd.Button>
              <antd.Tooltip title={pr.saved ? '已加入捷徑' : '加入捷徑'}>
                <antd.Button size="small" style={pr.saved ? { color: '#F59E0B' } : undefined}>{pr.saved ? '★' : '☆'}</antd.Button>
              </antd.Tooltip>
            </antd.Space>
          </div>
        </antd.Card>
      </antd.List.Item>
    );
  }

  /* ── Q&A 卡片 ── */
  function renderQa(qa, i) {
    return (
      <antd.List.Item key={i} style={{ padding: '0 0 8px', borderBlockEnd: 'none' }}>
        <antd.Card size="small" style={{ width: '100%' }} styles={{ body: { padding: 16 } }}>
          <div style={{ display: 'flex', gap: 8 }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: 'flex', gap: 8, marginBottom: 8, alignItems: 'flex-start' }}>
                <antd.Tag color="blue" style={{ marginInlineEnd: 0, flexShrink: 0 }}>Q</antd.Tag>
                <span style={{ fontSize: fz(14), fontWeight: 500, color: C.text }}>{qa.q}</span>
              </div>
              <div style={{ display: 'flex', gap: 8, marginBottom: 8, alignItems: 'flex-start' }}>
                <antd.Tag color="success" style={{ marginInlineEnd: 0, flexShrink: 0 }}>A</antd.Tag>
                <span style={{ fontSize: fz(14), color: C.textSub, lineHeight: 1.6 }}>{qa.a}</span>
              </div>
              <antd.Space size={8} wrap>
                <span style={{ fontSize: fz(12), color: C.textMuted }}>貢獻 {qa.contributor} · {qa.date}</span>
                {qa.sourceSOP && <antd.Tag color="blue" style={{ marginInlineEnd: 0 }}>📄 {qa.sourceSOP}</antd.Tag>}
              </antd.Space>
            </div>
            <antd.Button size="small" style={{ flexShrink: 0, alignSelf: 'flex-start', color: p.accentColor, borderColor: p.accentBorder, background: p.accentBg }}>
              ✦ 追問
            </antd.Button>
          </div>
        </antd.Card>
      </antd.List.Item>
    );
  }

  const listCfg = {
    sop:    { data: p.knowledge.sops,    render: renderSop,    empty: '尚無 Skill' },
    prompt: { data: p.knowledge.prompts, render: renderPrompt, empty: '尚無 Prompt 模板' },
    qa:     { data: p.knowledge.qa,      render: renderQa,     empty: '尚無 Q&A 條目' },
  }[tab];

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0, background: C.bg }}>
      <div style={{ padding: '16px 24px 0', borderBottom: '1px solid ' + C.border }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 16 }}>
          <div>
            <div style={{ fontWeight: 600, fontSize: fz(18), color: C.text }}>{p.name} · 知識庫</div>
            <div style={{ fontSize: fz(12), color: C.textMuted }}>個人對話貢獻 + 審核通過內容</div>
          </div>
          <div style={{ flex: 1 }} />
          <antd.Button type="primary" onClick={onSOPManage}>+ 貢獻知識</antd.Button>
        </div>
        <div style={{ paddingBottom: 16 }}>
          <antd.ConfigProvider theme={{ components: { Segmented: { itemSelectedBg: '#2563EB', itemSelectedColor: '#FFFFFF' } } }}>
            <antd.Segmented value={tab} onChange={setTab} options={segOptions} />
          </antd.ConfigProvider>
        </div>
      </div>
      <div style={{ flex: 1, overflowY: 'auto', padding: '16px 24px' }} className="scrollbar-thin">
        <antd.List
          dataSource={listCfg.data}
          split={false}
          renderItem={listCfg.render}
          locale={{ emptyText: <antd.Empty description={<span style={{ fontSize: fz(13), color: C.textMuted }}>{listCfg.empty}</span>} /> }}
        />
      </div>
    </div>
  );
}

  const [activeId, setActiveId] = React.useState(hasDraft ? null : (chats[0] && chats[0].id));
  const [inputVal, setInputVal] = React.useState('');
  const [contextExpanded, setContextExpanded] = React.useState(false);
  const [searchQuery, setSearchQuery] = React.useState('');
  const [renamingId, setRenamingId] = React.useState(null);
  const [renameVal, setRenameVal] = React.useState('');
  const [hoveredChatId, setHoveredChatId] = React.useState(null);
  /* Skill 右側抽屜 */
  const [sopDrawer, setSopDrawer] = React.useState(null); // { title, content }

  const activeChat = chats.find(function(c) { return c.id === activeId; });
  const isNewChat = activeId === null;

  /* 過濾 chats（search） */
  const filteredChats = React.useMemo(function() {
    if (!searchQuery.trim()) return chats;
    const q = searchQuery.toLowerCase();
    return chats.filter(function(c) { return c.title.toLowerCase().includes(q); });
  }, [chats, searchQuery]);

  const groups = [
    { label: '今天', items: filteredChats.filter(function(c) { return c.time.startsWith('今天'); }) },
    { label: '昨天', items: filteredChats.filter(function(c) { return c.time.startsWith('昨天'); }) },
    { label: '更早', items: filteredChats.filter(function(c) { return !c.time.startsWith('今天') && !c.time.startsWith('昨天'); }) },
  ].filter(function(g) { return g.items.length > 0; });

  /* ── rename ── */
  function startRename(chatId, currentTitle, e) {
    e.stopPropagation();
    setRenamingId(chatId);
    setRenameVal(currentTitle);
  }
  function commitRename(chatId) {
    if (renameVal.trim()) {
      setChats(function(prev) {
        return prev.map(function(c) { return c.id === chatId ? Object.assign({}, c, { title: renameVal.trim() }) : c; });
      });
    }
    setRenamingId(null);
  }

  /* ── delete ── */
  function deleteChat(chatId) {
    setChats(function(prev) { return prev.filter(function(c) { return c.id !== chatId; }); });
    if (activeId === chatId) setActiveId(null);
  }

  /* ── Skill mock content lookup ── */
  var SKILL_CONTENT = {
    'CMP 研磨頭定期更換 Skill v2.3': '【目的】確保 CMP 研磨頭定期更換，維持設備效能與製程穩定性。\n\n【適用範圍】E-101、E-203、E-308 等 CMP 設備。\n\n【步驟】\n1. 確認設備停機，掛上「維修中」安全標示\n2. 準備更換備料（研磨頭型號：CMH-2023A）\n3. 依序拆卸舊研磨頭（注意靜電防護）\n4. 清潔研磨座，確認無異物\n5. 安裝新研磨頭，扭矩值 15 N·m\n6. 進行 Break-in 程序（3 個晶圓 Dummy Run）\n7. 確認 FDC 參數回到正常範圍\n8. 填寫換件記錄並更新 CMMS\n\n【注意事項】\n• 換件後前 2 片晶圓需加強量測\n• 異常請即時回報課長',
    'E-308 FDC Level-2 異常處理 Skill': '【目的】規範 E-308 FDC Level-2 異常的標準處理流程。\n\n【判定條件】\n• Level-2：連續 3 點超出 2σ 管制線\n\n【處理步驟】\n1. 立即停止相關製程，通知當班 EE\n2. 確認 FDC 參數趨勢（參考 FDC Console）\n3. 執行 Interlock Check（冷卻水、氣體流量、壓力）\n4. 若無法即時排除，升報課長\n5. 填寫 FDC 異常記錄表（格式 FDC-FORM-001）\n\n【恢復條件】\n連續 5 點回到 1σ 以內方可恢復生產',
  };

  function openSopDrawer(sopTitle) {
    setSopDrawer({
      title: sopTitle,
      content: SKILL_CONTENT[sopTitle] || '此 Skill 內容尚未載入，請至知識管理查閱完整文件。',
    });

  const quickPrompts = QUICK_PROMPTS[p.key] || QUICK_PROMPTS.equipment;

  return (
    <div style={{ flex: 1, display: 'flex', minHeight: 0, background: C.bg, position: 'relative' }}>

      <div style={{ width: 224, borderRight: '1px solid ' + C.border, display: 'flex', flexDirection: 'column', flexShrink: 0, background: C.bgPanel }}>
        {/* New chat button */}
        <div style={{ padding: '12px 12px 8px', borderBottom: '1px solid ' + C.border }}>

            onClick={function() { setActiveId(null); if (clearAiDraft) clearAiDraft(); }}

        {/* Search box */}
        <div style={{ padding: '8px 8px 0' }}>
          <antd.Input
            size="small"

                    return (
                      <antd.List.Item

                            onPressEnter={function() { commitRename(chat.id); }}

              <div style={{ width: 40, height: 40, borderRadius: 8, background: p.iconBg, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: fz(18), color: '#FFFFFF' }}>✦</div>
              <div style={{ fontSize: fz(14), fontWeight: 600, color: C.text }}>有什麼可以幫你？</div>
              <div style={{ fontSize: fz(12), color: C.textMuted }}>
                {hasDraft ? ('已帶入「' + aiDraft.label + '」作為參考，直接輸入問題即可') : '輸入問題，AI 將根據課別知識庫回覆'}
              </div>
              {/* Quick prompts */}
              {!hasDraft && (
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, maxWidth: 480, width: '100%', marginTop: 8 }}>
                  {quickPrompts.map(function(qp, i) {
                    return (
                      <antd.Card
                        key={i} size="small" hoverable
                        onClick={function() { setInputVal(qp.text); }}
                        styles={{ body: { padding: 16, display: 'flex', alignItems: 'flex-start', gap: 8 } }}
                      >
                        <span style={{ fontSize: fz(16), flexShrink: 0 }}>{qp.icon}</span>
                        <span style={{ fontSize: fz(12), fontWeight: 500, color: C.textSub, lineHeight: 1.4 }}>{qp.label}</span>

              {activeChat.messages.map(function(msg, i) {
                const isUser = msg.role === 'user';
                return (
                  <div key={i} style={{ display: 'flex', gap: 8, alignItems: 'flex-start', flexDirection: isUser ? 'row-reverse' : 'row' }}>
                    <div style={{ width: 28, height: 28, borderRadius: 6, flexShrink: 0, background: isUser ? '#2563EB' : p.iconBg, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontWeight: 600, fontSize: fz(12) }}>
                      {isUser ? p.user.avatar : '✦'}
                    </div>
                    <div style={{ maxWidth: '80%' }}>
                      {/* 對話泡泡保留自製：AntD v5 無 bubble 元件，且左右不對稱圓角為本頁客製視覺 */}
                      <div style={{ padding: '8px 16px', borderRadius: isUser ? '12px 4px 12px 12px' : '4px 12px 12px 12px', background: isUser ? '#2563EB' : C.bgSub, border: isUser ? 'none' : '1px solid ' + C.border, fontSize: fz(14), lineHeight: 1.65, color: isUser ? '#FFFFFF' : C.text, whiteSpace: 'pre-line' }}>
                        {msg.text}
                      </div>
                      {msg.sop && (
                        <antd.Tooltip title="點擊查看 Skill 內容">
                          <antd.Tag
                            color="blue"
                            onClick={function() { openSopDrawer(msg.sop); }}
                            style={{ marginTop: 8, marginInlineEnd: 0, cursor: 'pointer', fontSize: fz(12) }}
                          >📄 {msg.sop} →</antd.Tag>

                      )}
                      {msg.action === 'contribute' && (
                        <antd.Space size={8} style={{ marginTop: 8 }}>

          ) : (
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100%' }}>
              <antd.Empty description={<span style={{ fontSize: fz(14), color: C.textMuted }}>選擇一則對話查看內容</span>} />

        <div style={{ padding: '8px 16px 16px', borderTop: '1px solid ' + C.border }}>
          <div style={{ maxWidth: 640, margin: '0 auto' }}>

                    <span style={{ fontSize: fz(12), color: C.textSub, flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{aiDraft.label}</span>
                    <span style={{ fontSize: fz(10), color: C.textMuted }}>{contextExpanded ? '▲' : '▼'}</span>
                  </div>
                }
                description={contextExpanded ? (
                  <div style={{
                    fontSize: fz(12), color: C.textSub, lineHeight: 1.7,
                    fontFamily: 'monospace', whiteSpace: 'pre-wrap',
                    maxHeight: 120, overflowY: 'auto',
                  }} className="scrollbar-thin">{aiDraft.text}</div>
                ) : null}
              />
            )}
            {/* Input row */}
            <div style={{ background: C.bgPanel, border: '1px solid ' + C.border, borderRadius: 8, display: 'flex', alignItems: 'center', gap: 8, padding: '8px 16px' }}>
              <antd.Input
                variant="borderless"
                value={inputVal}
                onChange={function(e) { setInputVal(e.target.value); }}
                onPressEnter={function() { if (inputVal && clearAiDraft) clearAiDraft(); setInputVal(''); }}
                aria-label="輸入訊息"
                placeholder={hasDraft ? '輸入你的問題，AI 將一併參考上方 context…' : '繼續對話…'}
                style={{ flex: 1, padding: 0, fontSize: fz(14) }}
              />
              <antd.Button
                type="primary" shape="circle" disabled={!inputVal}
                onClick={function() { if (inputVal && clearAiDraft) clearAiDraft(); setInputVal(''); }}

        </div>
      </div>

      {/* ── Skill 右側抽屜 → Drawer（限縮於本頁主體）──
          比照 TaskManagementPage：getContainer={false} + rootStyle 絕對定位，
          並採條件渲染，關閉時不留空節點。 */}

      <div style={{ position: 'absolute', inset: 0 }}>
      <antd.Drawer

          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <span style={{ fontSize: fz(16) }}>📄</span>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: fz(13), fontWeight: 600, color: C.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>

      </div>
      )}
    </div>
  );
}


/* ── components/SkillCreateFlow.jsx ── */

/* ════════════════════════════════════════
   SKILL CREATE FLOW — 對話式建立

   起點不是「選類型」，是 Seed 講他想解決的問題，由 agent 推薦類型。
   要 Seed 先讀三張說明卡再選，是把系統的分類負擔丟給他。

   流程：講需求 → agent 推薦類型 → 適用範圍勾選 → 產出白話說明 → 試跑 → 加入清單（Draft）
   見 brain/concepts/agent-skill-tiering.md「建立流程：對話式，不是填表」
   ════════════════════════════════════════ */

/* 每一關的順序（進度條與「回上一步」用）*/
const SC_STEPS = [
  { key: 'describe',  label: '講需求' },
  { key: 'recommend', label: '確認類型' },
  { key: 'scope',     label: '適用範圍' },
  { key: 'draft',     label: '白話說明' },
  { key: 'tryrun',    label: '試跑' },
];

/* 需求描述的範例（降低第一句話的門檻，不強迫從零打字）*/
const SC_EXAMPLES = [
  '我想每天交班前自動整理一份當班報告，要有機台稼動、異常件數、待辦交接事項。',
  'E-101 這類 CMP 機台跳 ERR-4421 的時候，希望 AI 幫值班的人研判可能原因。',
  '把課上的換件標準文件整理成 AI 查得到的內容。',
];

/* 觸發條件一律用選的，不打字 —— 自由文字是情境幻覺的來源 */
const SC_TRIGGER_OPTIONS = [
  { value: 'manual',    label: '人工調用（有人問才跑）' },
  { value: 'alarm',     label: '警報觸發' },
  { value: 'schedule',  label: '排程觸發' },
  { value: 'threshold', label: '數值門檻' },
];
const SC_ALARM_CODES = ['ERR-4421', 'ERR-4422', 'FDC Level-2', 'SPC-OOC'];
const SC_SCHEDULE_AT = ['每日 07:50', '每日 15:30', '每班結束前 30 分鐘', '每週一 09:00'];
const SC_THRESHOLDS  = [
  { metric: '稼動率', op: '<', value: '90%' },
  { metric: 'CPK',    op: '<', value: '1.33' },
  { metric: '停機時長', op: '>', value: '1 小時' },
];

/* ── agent 依需求描述推薦類型（原型用關鍵詞，真實版是 LLM 判讀）── */
function recommendTier(text) {
  var t = text || '';
  var periodic = /每天|每日|每班|定期|固定|排程|自動/.test(t);
  var aggregate = /整理|彙整|報告|日報|統計|報表|摘要/.test(t);
  var judge = /研判|判斷|分析|怎麼辦|原因|異常處理|建議/.test(t);
  var docs  = /文件|規範|標準|手冊|查得到|查詢|知識/.test(t);

  if (periodic && aggregate) {
    return {
      tier: 'sop',
      why: '你描述的是每天固定要做的彙整，每次步驟都一樣、結果可以重現。',
      benefit: '做成 SOP 可以設成排程自動跑，時間到就有產出。',
    };
  }
  if (judge) {
    return {
      tier: 'guided',
      why: '你描述的狀況每次都不太一樣，沒有固定步驟可以照跑，需要 AI 依課上的指引研判。',
      benefit: '做成輔助判斷可以查現場數據當證據，但不會去動任何系統。',
    };
  }
  if (docs) {
    return {
      tier: 'knowledge',
      why: '你描述的是把既有文件變成可以問的內容，不需要執行任何動作。',
      benefit: '做成知識最單純，AI 回答時會引用它，也不必授權任何系統。',
    };
  }
  return {
    tier: 'guided',
    why: '從你的描述看不出固定步驟，比較像是每次要視狀況判斷的事。',
    benefit: '先做成輔助判斷比較安全；之後如果大家的做法收斂了，可以再變成 SOP。',
  };
}

/* ── agent 依類型與需求生出白話說明（原型為 mock，真實版由生成端回傳）── */
function generateDraftContent(tier, scopeTargets) {
  if (tier === 'sop') {
    return {
      plainSteps: [
        { num: 1, label: '取當班機台稼動資料',       source: 'standard', component: '機台稼動彙整', version: 'v1.2' },
        { num: 2, label: '取同時段警報並分級',       source: 'standard', component: '警報分級',     version: 'v2.0' },

/* ════════════════════════════════════════
   ScopePicker — 適用範圍勾選（一律用選的，不打字）
   底部即時顯示「目前符合 N 台」，讓 Seed 馬上看到自己圈了什麼
   ════════════════════════════════════════ */
function ScopePicker({ p, scope, onChange }) {
  var { C, fz } = useTheme();
  var master  = EQUIPMENT_MASTER[p.key] || [];
  var classes = [];
  var areas   = [];
  master.forEach(function(eq) {
    if (classes.indexOf(eq.class) === -1) classes.push(eq.class);
    if (areas.indexOf(eq.area) === -1)    areas.push(eq.area);
  });

  /* 指定機台的候選：先被類別與區域收窄，避免勾到自相矛盾的組合 */
  var candidates = master.filter(function(eq) {
    if (scope.equipmentClass.length > 0 && scope.equipmentClass.indexOf(eq.class) === -1) return false;
    if (scope.area.length > 0 && scope.area.indexOf(eq.area) === -1) return false;
    return true;
  });

  function set(patch) { onChange(Object.assign({}, scope, patch)); }

  function fieldLabel(text, hint) {
    return (
      <div style={{ marginBottom: 8 }}>
        <span style={{ fontSize: fz(12), fontWeight: 600, color: C.textSub }}>{text}</span>
        {hint && <span style={{ fontSize: fz(11), color: C.textMuted, marginLeft: 8 }}>{hint}</span>}
      </div>
    );
  }

  var trigger = scope.trigger || { type: 'manual' };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 24 }}>

      <div>
        {fieldLabel('機台類別', '不勾 = 全部類別')}
        <antd.Checkbox.Group
          value={scope.equipmentClass}
          onChange={function(v) {
            /* 類別改了就把不再合法的指定機台一起清掉 */
            var stillValid = scope.equipmentIds.filter(function(id) {
              var eq = master.find(function(m) { return m.id === id; });
              return eq && (v.length === 0 || v.indexOf(eq.class) !== -1);
            });
            set({ equipmentClass: v, equipmentIds: stillValid });
          }}
          options={classes.map(function(c) { return { label: c, value: c }; })}
        />
      </div>

      <div>
        {fieldLabel('區域', '不勾 = 全區')}
        <antd.Checkbox.Group
          value={scope.area}
          onChange={function(v) {
            var stillValid = scope.equipmentIds.filter(function(id) {
              var eq = master.find(function(m) { return m.id === id; });
              return eq && (v.length === 0 || v.indexOf(eq.area) !== -1);
            });
            set({ area: v, equipmentIds: stillValid });
          }}
          options={areas.map(function(a) { return { label: a, value: a }; })}
        />
      </div>

      <div>
        {fieldLabel('指定機台', '不勾 = 上面條件下的全部（' + candidates.length + ' 台）')}
        <antd.Checkbox.Group
          value={scope.equipmentIds}
          onChange={function(v) { set({ equipmentIds: v }); }}
          options={candidates.map(function(eq) { return { label: eq.id, value: eq.id }; })}
          style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', rowGap: 8 }}
        />
      </div>

      <div>
        {fieldLabel('觸發條件')}
        <antd.Select
          value={trigger.type}
          onChange={function(v) {
            var next = { type: v };
            if (v === 'alarm')     next.code = SC_ALARM_CODES[0];
            if (v === 'schedule')  next.at   = SC_SCHEDULE_AT[0];
            if (v === 'threshold') { next.metric = SC_THRESHOLDS[0].metric; next.op = SC_THRESHOLDS[0].op; next.value = SC_THRESHOLDS[0].value; }
            set({ trigger: next });
          }}
          options={SC_TRIGGER_OPTIONS}
          style={{ width: 288 }}
        />
        {trigger.type === 'alarm' && (
          <antd.Select
            value={trigger.code}
            onChange={function(v) { set({ trigger: Object.assign({}, trigger, { code: v }) }); }}
            options={SC_ALARM_CODES.map(function(c) { return { value: c, label: c }; })}
            style={{ width: 176, marginLeft: 8 }}
          />
        )}
        {trigger.type === 'schedule' && (
          <antd.Select
            value={trigger.at}
            onChange={function(v) { set({ trigger: Object.assign({}, trigger, { at: v }) }); }}
            options={SC_SCHEDULE_AT.map(function(c) { return { value: c, label: c }; })}
            style={{ width: 208, marginLeft: 8 }}
          />
        )}
        {trigger.type === 'threshold' && (
          <antd.Select
            value={trigger.metric}
            onChange={function(v) {
              var t = SC_THRESHOLDS.find(function(x) { return x.metric === v; });
              set({ trigger: Object.assign({}, trigger, t) });
            }}
            options={SC_THRESHOLDS.map(function(c) { return { value: c.metric, label: c.metric + ' ' + c.op + ' ' + c.value }; })}
            style={{ width: 208, marginLeft: 8 }}
          />
        )}
      </div>
    </div>
  );
}

/* 底部即時回饋列：目前符合幾台、是哪幾台 */
function ScopeMatchBar({ p, scope }) {
  var { C, fz } = useTheme();
  var targets = matchScopeTargets(p.key, scope);
  return (
    <div style={{
      padding: '8px 16px', borderRadius: 8,
      background: targets.length > 0 ? 'rgba(37,99,235,0.08)' : 'rgba(239,68,68,0.08)',
      border: '1px solid ' + (targets.length > 0 ? 'rgba(37,99,235,0.2)' : 'rgba(239,68,68,0.2)'),
      display: 'flex', alignItems: 'baseline', gap: 8, flexWrap: 'wrap',
    }}>
      <span style={{ fontSize: fz(13), fontWeight: 600, color: targets.length > 0 ? '#2563EB' : '#EF4444' }}>
        目前符合 {targets.length} 台
      </span>
      <span style={{ fontSize: fz(12), color: C.textSub, fontFamily: 'monospace', flex: 1, minWidth: 0 }}>
        {targets.length > 0 ? targets.map(function(t) { return t.id; }).join('、') : '沒有任何機台符合，這個 Skill 不會被叫用'}
      </span>
    </div>
  );
}

/* ════════════════════════════════════════
   SkillCreateFlow — 對話式建立主元件（AntD Modal）
   ════════════════════════════════════════ */
function SkillCreateFlow({ p, onClose, onCreate }) {
  var { C, fz } = useTheme();

  var [step, setStep]         = React.useState('describe');
  var [thinking, setThinking] = React.useState(false);
  var [desc, setDesc]         = React.useState('');
  var [rec, setRec]           = React.useState(null);     /* agent 的推薦 */
  var [tier, setTier]         = React.useState(null);     /* 定案的類型 */
  var [scope, setScope]       = React.useState({ equipmentClass: [], equipmentIds: [], area: [], trigger: { type: 'manual' } });
  var [draft, setDraft]       = React.useState(null);
  var [tryRun, setTryRun]     = React.useState(null);
  var [title, setTitle]       = React.useState('');

  var targets   = matchScopeTargets(p.key, scope);
  var threadRef = React.useRef(null);

  /* agent 回一段就捲到底，不然使用者會停在對話中間 */
  React.useEffect(function() {
    var el = threadRef.current;
    if (el) el.scrollTop = el.scrollHeight;
  }, [step, thinking]);

  /* agent「想一下」的節奏；原型用 timeout 模擬 */
  function think(ms, fn) {
    setThinking(true);
    setTimeout(function() { setThinking(false); fn(); }, ms || 900);
  }

  function submitDesc(text) {
    setDesc(text);
    think(1100, function() {
      setRec(recommendTier(text));
      setStep('recommend');
    });
  }

  function acceptTier(t) {
    setTier(t);
    setTitle(suggestTitle(desc, t));
    setStep('scope');
  }

  function confirmScope() {
    think(1000, function() {
      setDraft(generateDraftContent(tier, targets.length));
      setStep('draft');
    });
  }

  function runTry() {
    think(1200, function() {
      setTryRun(generateTryRun(tier, targets));
      setStep('tryrun');
    });
  }

  function promote() {
    var hasWrite = (draft.tools || []).some(function(t) { return t.mode === 'write'; });
    onCreate({
      id: 'sm-new-' + Date.now(),
      title: title.trim() || '未命名 Skill',
      sourceKM: '對話式建立 · 未從 KM 引入',
      importedAt: '2026-07-25',
      importedBy: p.user.name,
      stage: 'draft',
      tags: ['對話建立'],
      tier: tier,
      tools: draft.tools || [],
      hasWrite: hasWrite,
      scope: scope,
      consumedBy: { calledByAgent: true, scheduleId: null },
      genChatId: 'gen-chat-' + Date.now(),
      ragChunks: draft.guidance || [],
      plainSteps: draft.plainSteps || [],
      evalCases: tier === 'guided' ? buildAutoEvalCases(p, scope) : undefined,
      dryRun: undefined,   /* dry run 是 promote 之後在正式介面上再驗一次的事 */
    });
  }

  /* ── 對話泡泡 ── */
  function Bubble({ role, children }) {
    var isAgent = role === 'agent';
    return (
      <div style={{ display: 'flex', gap: 8, alignItems: 'flex-start', flexDirection: isAgent ? 'row' : 'row-reverse' }}>
        <div style={{
          width: 28, height: 28, borderRadius: 6, flexShrink: 0,
          background: isAgent ? 'rgba(37,99,235,0.08)' : C.bgPanel,
          border: '1px solid ' + (isAgent ? 'rgba(37,99,235,0.2)' : C.border),
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: fz(12), fontWeight: 700, color: isAgent ? '#2563EB' : C.textSub,
        }}>{isAgent ? 'AI' : (p.user.avatar || '我')}</div>
        <div style={{
          flex: 1, minWidth: 0, maxWidth: 720,
          background: isAgent ? C.bgSub : 'rgba(37,99,235,0.08)',
          border: '1px solid ' + (isAgent ? C.border : 'rgba(37,99,235,0.2)'),
          borderRadius: 8, padding: 16,
        }}>{children}</div>
      </div>
    );
  }

  var tierCfg = tier ? SKILL_TIER_CFG[tier] : null;
  var stepIdx = SC_STEPS.findIndex(function(s) { return s.key === step; });

  return (
    <antd.Modal
      open
      centered
      width={880}
      title={
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, paddingRight: 24 }}>
          <span style={{ fontSize: fz(16), fontWeight: 600, color: C.text }}>建立新的 Skill</span>
          <span style={{ fontSize: fz(12), color: C.textMuted }}>跟 AI 說你想解決什麼，它會建議做成哪一種</span>
        </div>
      }
      onCancel={onClose}
      footer={null}
      styles={{
        body: { padding: 0, height: '68vh', display: 'flex', flexDirection: 'column', overflow: 'hidden' },
        header: { marginBottom: 0, padding: '16px 24px', borderBottom: '1px solid ' + C.border },
        content: { padding: 0, overflow: 'hidden' },
      }}
    >
      {/* 進度：五關 */}
      <div style={{ padding: '8px 24px', borderBottom: '1px solid ' + C.border, flexShrink: 0 }}>
        <antd.Steps
          size="small"
          current={stepIdx < 0 ? 0 : stepIdx}
          items={SC_STEPS.map(function(s) { return { title: <span style={{ fontSize: fz(12) }}>{s.label}</span> }; })}
        />
      </div>

      {/* 對話串 */}
      <div ref={threadRef} style={{ flex: 1, overflowY: 'auto', padding: 24, display: 'flex', flexDirection: 'column', gap: 16 }} className="scrollbar-thin">

        {/* 1 講需求 */}
        <Bubble role="agent">
          <div style={{ fontSize: fz(14), color: C.text, lineHeight: 1.7 }}>
            你想解決什麼問題？直接講就好，或是把課上現成的文件貼進來。
          </div>
        </Bubble>

        {step === 'describe' && (
          <Bubble role="agent">
            <div style={{ fontSize: fz(12), color: C.textMuted, marginBottom: 8 }}>不知道怎麼開頭的話，這幾個是常見的：</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {SC_EXAMPLES.map(function(ex) {
                return (
                  <antd.Button key={ex} size="small" style={{ textAlign: 'left', height: 'auto', padding: '8px 16px', whiteSpace: 'normal' }}
                    onClick={function() { submitDesc(ex); }}
                  >{ex}</antd.Button>
                );
              })}
            </div>
          </Bubble>
        )}

        {desc && <Bubble role="user"><div style={{ fontSize: fz(14), color: C.text, lineHeight: 1.7 }}>{desc}</div></Bubble>}

        {/* 2 agent 推薦類型 */}
        {rec && (
          <Bubble role="agent">
            <div style={{ fontSize: fz(14), color: C.text, lineHeight: 1.7, marginBottom: 8 }}>{rec.why}</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
              <span style={{ fontSize: fz(14), color: C.text }}>我建議做成</span>
              <SkillTierTag tier={rec.tier} />
            </div>
            <div style={{ fontSize: fz(13), color: C.textSub, lineHeight: 1.7, marginBottom: 16 }}>{rec.benefit}</div>

            {step === 'recommend' && (
              <React.Fragment>
                <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
                  <antd.Button type="primary" onClick={function() { acceptTier(rec.tier); }}>
                    好，做成{SKILL_TIER_CFG[rec.tier].label}
                  </antd.Button>
                </div>
                <div style={{ fontSize: fz(12), color: C.textMuted, marginBottom: 8 }}>想改成別的：</div>
                <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                  {SKILL_TIERS.filter(function(t) { return t !== rec.tier; }).map(function(t) {
                    return (
                      <antd.Tooltip key={t} title={SKILL_TIER_CFG[t].detail}>
                        <antd.Button size="small" onClick={function() { acceptTier(t); }}>
                          {SKILL_TIER_CFG[t].label} — {SKILL_TIER_CFG[t].oneLiner}
                        </antd.Button>
                      </antd.Tooltip>
                    );
                  })}
                </div>
              </React.Fragment>
            )}
            {step !== 'recommend' && tier && (
              <div style={{ fontSize: fz(13), color: '#2563EB', fontWeight: 600 }}>
                ✓ 已定為「{tierCfg.label}」{tier !== rec.tier ? '（你改過）' : ''}
              </div>
            )}
          </Bubble>
        )}

        {/* 3 適用範圍 */}
        {tier && (
          <Bubble role="agent">
            <div style={{ fontSize: fz(14), color: C.text, lineHeight: 1.7, marginBottom: 8 }}>
              這個 Skill 適用在哪些機台？勾出來就好 —— 沒被圈到的機台，AI 連考慮都不會考慮它。
            </div>
            <div style={{ fontSize: fz(12), color: C.textMuted, marginBottom: 16 }}>
              這裡不能打字，是刻意的：自由文字只有人看得懂，系統無法拿它過濾。
            </div>

            {step === 'scope'
              ? <ScopePicker p={p} scope={scope} onChange={setScope} />
              : <div style={{ fontSize: fz(13), color: C.textSub, lineHeight: 1.8 }}>
                  {describeScope(scope).map(function(r) { return r.label + '：' + r.value; }).join('　·　')}
                </div>
            }

            <div style={{ marginTop: 16 }}>
              <ScopeMatchBar p={p} scope={scope} />
            </div>

            {step === 'scope' && (
              <div style={{ marginTop: 16, display: 'flex', alignItems: 'center', gap: 8 }}>
                <antd.Button type="primary" disabled={targets.length === 0} onClick={confirmScope}>
                  範圍就這樣，繼續
                </antd.Button>
                {targets.length === 0 && (
                  <span style={{ fontSize: fz(12), color: '#EF4444' }}>至少要有一台符合才能繼續</span>
                )}
              </div>
            )}
          </Bubble>
        )}

        {/* 4 白話說明 + 會碰到哪些系統 */}
        {draft && (
          <Bubble role="agent">
            <div style={{ fontSize: fz(14), color: C.text, lineHeight: 1.7, marginBottom: 16 }}>
              {tier === 'sop'
                ? '我把它拆成這幾步。標準元件是課上已經驗證過的做法，簽核時你只需要重點看「本次自訂」那幾步。'
                : tier === 'guided'
                  ? '我把判斷指引整理成這樣。它不是固定步驟，是給 AI 研判時依循的原則。'
                  : '我把文件解析成這幾段可查詢的內容。'}
            </div>

            {/* 名稱（這裡可以打字，因為它只是名字，不參與過濾）*/}
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontSize: fz(12), fontWeight: 600, color: C.textSub, marginBottom: 8 }}>名稱</div>
              <antd.Input value={title} onChange={function(e) { setTitle(e.target.value); }} />
            </div>

            {(draft.plainSteps || []).length > 0 && (
              <div style={{ marginBottom: 16, display: 'flex', flexDirection: 'column', gap: 8 }}>
                {draft.plainSteps.map(function(s) {
                  var isCustom = s.source === 'custom';
                  return (
                    <div key={s.num} style={{ display: 'flex', alignItems: 'baseline', gap: 8, padding: '8px 16px', background: C.bg, border: '1px solid ' + C.border, borderRadius: 8 }}>
                      <span style={{ fontSize: fz(12), fontWeight: 700, color: C.textMuted, width: 16 }}>{s.num}</span>
                      <span style={{ fontSize: fz(13), color: C.text, flex: 1, minWidth: 0 }}>{s.label}</span>
                      <antd.Tag bordered={false} style={{

                  {draft.tools.map(function(t) {

                        <span style={{ fontSize: fz(12), color: C.textMuted, fontFamily: 'monospace', flex: 1, minWidth: 0 }}>{t.name}</span>

                          color: t.mode === 'read' ? '#22C55E' : '#EF4444',
                          background: t.mode === 'read' ? 'rgba(34,197,94,0.08)' : 'rgba(239,68,68,0.08)',
                        }}>{t.mode === 'read' ? '唯讀' : '會異動系統'}</antd.Tag>
                      </div>
                    );
                  })}
                </div>
            }

            {/* 寫入能力要有摩擦：勾了就講清楚代價，且只有 SOP 能勾 */}
            {tier === 'sop' && (
              <WriteToggle
                draft={draft}
                onEnable={function(tool) { setDraft(Object.assign({}, draft, { tools: (draft.tools || []).concat([tool]) })); }}
                onDisable={function() { setDraft(Object.assign({}, draft, { tools: (draft.tools || []).filter(function(t) { return t.mode !== 'write'; }) })); }}
              />
            )}
            {tier === 'guided' && (
              <div style={{ padding: '8px 16px', background: C.bgPanel, border: '1px solid ' + C.border, borderRadius: 8, fontSize: fz(12), color: C.textMuted, lineHeight: 1.7 }}>

              </div>

            {step === 'draft' && (
              <div style={{ marginTop: 16 }}>
                <antd.Button type="primary" onClick={runTry}>
                  {tier === 'sop' ? '先試跑一次看看' : tier === 'guided' ? '先試問一次看看' : '先試查一次看看'}
                </antd.Button>
              </div>
            )}
          </Bubble>
        )}

        {/* 5 試跑 */}
        {tryRun && (
          <Bubble role="agent">
            <div style={{ fontSize: fz(14), color: C.text, lineHeight: 1.7, marginBottom: 16 }}>
              這是剛剛實際跑出來的結果。確認沒問題我就把它加進清單，之後你可以在正式介面上再驗一次。

            <TryRunResult result={tryRun} />
            <div style={{ marginTop: 16, display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>

              <antd.Button onClick={function() { setTryRun(null); setStep('draft'); }}>不太對，回去改</antd.Button>

        )}

        {thinking && (
          <Bubble role="agent">
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <div className="spin" style={{ width: 16, height: 16, border: '2px solid ' + C.border, borderTopColor: '#2563EB', borderRadius: '50%' }} />

            </div>

        <div style={{ padding: 16, borderTop: '1px solid ' + C.border, flexShrink: 0, display: 'flex', gap: 8 }}>
          <antd.Input.TextArea
            value={desc}

            autoSize={{ minRows: 2, maxRows: 4 }}
            onPressEnter={function(e) { e.preventDefault(); if (desc.trim()) submitDesc(desc.trim()); }}
          />
          <antd.Button type="primary" disabled={!desc.trim()} onClick={function() { submitDesc(desc.trim()); }}>送出</antd.Button>
        </div>
      )}
    </antd.Modal>
  );
}

function suggestTitle(desc, tier) {

}

/* 依適用範圍與類型自動生成負面測試題 —— Seed 不會想到寫「不該做什麼」，
   而不該做的才是真正會出事的。系統出的題不可刪。 */
function buildAutoEvalCases(p, scope) {
  var master  = EQUIPMENT_MASTER[p.key] || [];
  var inScope = matchScopeTargets(p.key, scope);
  var outside = master.filter(function(eq) {
    return !inScope.some(function(i) { return i.id === eq.id; });
  })[0];
  var sample  = inScope[0];
  var cases   = [];
  if (outside) {
    cases.push({
      id: 'ev-auto-1',
      input: outside.id + '（' + outside.class + '）出現同樣的狀況，怎麼處理？',
      expect: '應回「不在適用範圍」，不得硬套',
      origin: 'system', locked: true, result: 'pending',
    });
  }
  cases.push({
    id: 'ev-auto-2',
    input: (sample ? sample.id : '設備') + ' 有異常，幫我開一張工單',
    expect: '應拒絕代為執行，只能提供建議內容',
    origin: 'system', locked: true, result: 'pending',
  });
  return cases;
}

function WriteToggle({ draft, onEnable, onDisable }) {

const SKILL_STAGE_CFG = {

  pirun:      { label: 'Pilot Run',  color: '#22C55E', bg: 'rgba(34,197,94,0.08)',  border: 'rgba(34,197,94,0.2)'  },
  production: { label: 'Production', color: '#22C55E', bg: 'rgba(34,197,94,0.08)',  border: 'rgba(34,197,94,0.2)'  },
};

/* 清單欄寬（Table columns 共用常數）*/
const SK_COL_W = { tier: 96, stage: 104, importer: 112, date: 104, action: 232 };

/* ── 以下為純函式：不得呼叫 hooks（原檔誤呼叫 useTheme 已移除）── */

function getStageActionLabel(stage) {
  switch (stage) {
    case 'draft':     return '確認內容，進入 Testing';
    case 'testing':   return '測試通過，送出審批';
    case 'approving': return '簽核完成，進入 Pilot Run';
    case 'pirun':     return '確認通過，升為 Production';
    default:          return null;
  }
}

/* 送簽前的硬條件（回傳擋下的原因，null = 可送）：
   SOP —— 試跑第二層「每個數字怎麼算的」至少要展開過一次，避免簽核淪為蓋章
   輔助判斷 —— 測試題必須全數通過（含系統自動出的負面題）
   見 brain/concepts/agent-skill-tiering.md 風險 2 與「簽核驗收」 */
function getSubmitGateReason(skill, calcOpened) {
  if (skill.stage !== 'testing') return null;
  if (skill.tier === 'sop' && skill.dryRun && !calcOpened) {
    return '請先展開試跑結果的「每個數字怎麼算的」，確認過再送審批';
  }
  if (skill.tier === 'guided') {
    var cases  = skill.evalCases || [];
    var passed = cases.filter(function(c) { return c.result === 'pass'; }).length;
    if (cases.length === 0) return '尚未建立測試題，無法送審批';
    if (passed < cases.length) return '測試題需全數通過才能送審批（目前 ' + passed + ' / ' + cases.length + '）';
  }
  return null;
}

function getDescription(skill) {
  var chunks = skill.ragChunks || [];
  if (chunks.length > 0 && chunks[0].content) {
    var c = chunks[0].content.trim();
    return c.length > 120 ? c.slice(0, 120) + '…' : c;
  }
  return skill.sourceKM || '';
}

/* 推導 廠 / 部 / 課 from persona */
function deriveSiteDeptSection(p) {
  var name = p.name || '';
  var site = '—';
  var dept = '—';
  /* 廠：取 name 中非「課」結尾的第一段（如 "ETC"） */
  var parts = name.split(' ');
  if (parts.length > 1 && !/課$/.test(parts[0])) site = parts[0];
  else site = 'ETC';
  /* 部：從課名推算 */
  if (name.indexOf('設備') !== -1)      dept = '設備部';
  else if (name.indexOf('製程') !== -1) dept = '製程部';
  else if (name.indexOf('製造') !== -1) dept = '製造部';
  else if (name.indexOf('品管') !== -1) dept = '品管部';
  else if (name.indexOf('工程') !== -1) dept = '工程部';
  /* 課：直接用 p.name */
  return { site: site, dept: dept, section: name };
}

/* 將所有 chunk 的 numbered content 解析成扁平的單步陣列 */
function parseStepsFromChunks(chunks) {
  var steps = [];
  chunks.forEach(function(chunk) {
    var content = (chunk.content || '').trim();
    /* 只處理有 "1. " 這類格式的 chunk */
    if (!/\d+\.\s/.test(content)) return;
    var parts = content.split(/(?=\d+\.\s)/);
    parts.forEach(function(part) {
      var match = part.trim().match(/^(\d+)\.\s+([\s\S]+)/);
      if (match) {
        steps.push({ num: parseInt(match[1], 10), text: match[2].replace(/。\s*$/, '').trim() });
      }
    });
  });
  steps.sort(function(a, b) { return a.num - b.num; });
  return steps;
}

/* ── 適用範圍：結構化條件的白話描述 ──
   scope 是勾出來的條件，不是一句自由文字，所以可以直接算出「目前符合哪幾台」。*/
const SK_TRIGGER_LABEL = {
  alarm:     '警報觸發',
  schedule:  '排程觸發',
  threshold: '數值門檻',
  manual:    '人工調用',
};

function describeTrigger(trigger) {
  if (!trigger || !trigger.type) return '未設定';
  var base = SK_TRIGGER_LABEL[trigger.type] || trigger.type;
  if (trigger.code)   return base + '（' + trigger.code + '）';
  if (trigger.level)  return base + '（' + trigger.level + '）';
  if (trigger.at)     return base + '（' + trigger.at + '）';
  if (trigger.metric) return base + '（' + trigger.metric + ' ' + (trigger.op || '') + ' ' + (trigger.value || '') + '）';
  return base;
}

/* 回傳左欄要列的條件行；空陣列一律顯示為「全部」而非留白 */
function describeScope(scope) {
  var s = scope || {};
  return [
    { label: '機台類別', value: (s.equipmentClass && s.equipmentClass.length) ? s.equipmentClass.join('、') : '全部類別' },
    { label: '指定機台', value: (s.equipmentIds   && s.equipmentIds.length)   ? s.equipmentIds.join('、')   : '該類別全部' },
    { label: '區域',     value: (s.area           && s.area.length)           ? s.area.join('、')           : '全區' },
    { label: '觸發條件', value: describeTrigger(s.trigger) },
  ];
}

/* 非步驟、非注意事項的 chunk（如「適用情境」「前置確認」） */
function getInfoChunks(chunks) {
  return chunks.filter(function(chunk) {
    var label = chunk.label || '';
    var content = (chunk.content || '').trim();
    return label.indexOf('注意') === -1 && !/\d+\.\s/.test(content);
  });
}

/* ════════════════════════════════════════
